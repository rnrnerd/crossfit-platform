<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админка — Кроссфит-платформа</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    /*
      Токены те же, что в приложении, плотность другая: это рабочий стол
      оператора, а не витрина. Таблицы, а не карточки.
    */
    :root {
      --void:#08090a; --plate:#131417; --plate2:#1b1d21;
      --chalk:#f2f1ee; --steel:#7c828b; --live:#ff3b30; --accent:#a8cc3a;
      --hair:rgba(255,255,255,.09);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Onest',-apple-system,'Segoe UI',Roboto,sans-serif;
      background:var(--void); color:var(--chalk); font-size:14px; line-height:1.45;
      -webkit-font-smoothing:antialiased; }
    button, input, select, textarea { font:inherit; color:inherit; }
    [hidden] { display:none !important; }
    a { color:var(--accent); }

    /* ── Вход ── */
    .login { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .login form { width:340px; background:var(--plate); border-radius:14px; padding:26px; }
    .login h1 { font-size:19px; font-weight:700; letter-spacing:-.02em; }
    .login p { color:var(--steel); margin:6px 0 20px; }

    /* ── Каркас ── */
    .top { display:flex; align-items:center; gap:16px; padding:0 22px; height:56px;
      box-shadow:inset 0 -1px 0 var(--hair); position:sticky; top:0; background:var(--void); z-index:5; }
    .top b { font-size:15px; font-weight:700; color:var(--accent); }
    .top .sp { flex:1; }
    .wrap { display:grid; grid-template-columns:200px 1fr; align-items:start; }
    .nav { padding:18px 12px; position:sticky; top:56px; }
    .nav button { display:block; width:100%; text-align:left; background:none; border:none;
      cursor:pointer; padding:9px 12px; border-radius:8px; color:var(--steel); font-weight:500; }
    .nav button[aria-current] { background:var(--plate); color:var(--chalk); }
    .main { padding:22px 26px 60px; min-width:0; }

    h2 { font-size:20px; font-weight:700; letter-spacing:-.02em; }
    .row-between { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .muted { color:var(--steel); }
    .sub { color:var(--steel); margin-top:4px; }

    /* ── Таблицы ── */
    table { width:100%; border-collapse:collapse; margin-top:16px; }
    th { text-align:left; font-size:12px; font-weight:500; color:var(--steel);
      padding:0 10px 8px; box-shadow:inset 0 -1px 0 var(--hair); white-space:nowrap; }
    td { padding:11px 10px; box-shadow:inset 0 -1px 0 var(--hair); vertical-align:top; }
    tr.click { cursor:pointer; }
    tr.click:hover td { background:var(--plate); }
    td.num { font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
    .tag { display:inline-block; font-size:11px; font-weight:600; background:var(--plate2);
      border-radius:6px; padding:3px 7px; white-space:nowrap; }
    .tag.on { background:var(--accent); color:var(--void); }
    .tag.off { color:var(--steel); }
    .tag.late { color:var(--live); }
    /* те же цвета уровней, что в приложении: оператор сверяет глазами */
    .tag.lv-bg    { color:#4ec97a; background:rgba(78,201,122,.15); }
    .tag.lv-inter { color:#4a9df0; background:rgba(74,157,240,.15); }
    .tag.lv-rx    { color:#f5a03c; background:rgba(245,160,60,.15); }
    .tag.lv-elite { color:#ef4a52; background:rgba(239,74,82,.15); }

    /* Вкладки внутри события: страница успела собрать настройки, категории,
       комплексы, результаты, заявки и судей — одним свитком это не читается. */
    .etabs { display:flex; flex-wrap:wrap; gap:2px; margin:26px 0 20px;
      box-shadow:inset 0 -1px 0 var(--hair); }
    .etab { padding:10px 14px; background:none; border:none; cursor:pointer;
      font:inherit; font-size:14px; color:var(--steel);
      border-bottom:2px solid transparent; margin-bottom:-1px; }
    .etab:hover { color:var(--chalk); }
    .etab.on { color:var(--accent); border-bottom-color:var(--accent); }

    /* Сетка результатов: в ячейке сырой результат, под ней место и баллы */
    .grid-res { overflow-x:auto; }
    .grid-res th.wod { min-width:124px; }
    .grid-res td.cell { padding:4px 6px; }
    .grid-res input.val { width:98px; background:var(--plate2); border:1px solid transparent;
      border-radius:6px; padding:7px 8px; color:var(--chalk); font:inherit;
      font-size:14px; font-variant-numeric:tabular-nums; text-align:right; }
    .grid-res input.val:focus { outline:none; border-color:var(--accent); }
    .grid-res input.val.bad { border-color:var(--live); }
    #r-find.bad { border-color:var(--live); }
    .grid-res input.val.ok { border-color:rgba(168,204,58,.55); }
    .grid-res .pts { font-size:11px; color:var(--steel); text-align:right;
      margin-top:3px; min-height:14px; }
    .grid-res .pts b { color:var(--chalk); font-weight:600; }

    .checks { display:flex; flex-wrap:wrap; gap:8px; }
    .chk { display:inline-flex; align-items:center; gap:7px; background:var(--plate2);
      border-radius:8px; padding:8px 11px; font-size:14px; cursor:pointer; }
    .chk input { accent-color:var(--accent); }
    /* Готовность старта. Экраны у всех событий одинаковые, различается только
       наполнение — список показывает, чего не хватает, и ведёт туда, где это
       заводится. Иначе неполнота обнаруживается в день соревнования. */
    .ready { display:grid; gap:2px; margin:18px 0 6px; }
    .ready a { display:flex; align-items:baseline; gap:10px; padding:9px 12px;
      border-radius:8px; color:var(--chalk); text-decoration:none; font-size:14px; }
    .ready a:hover { background:var(--plate); }
    .ready i { font-style:normal; width:18px; flex:none; text-align:center; }
    .ready .ok i { color:var(--accent); }
    .ready .no i { color:var(--steel); }
    .ready .no b { font-weight:500; }
    .ready .warn-it i { color:var(--live); }
    .ready .val { margin-left:auto; color:var(--steel); font-size:13px; }
    .row-lane { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
    .row-lane .ln { width:74px; }
    .row-lane .le { flex:1; max-width:460px; }

    /* .tag используется и как метка, и как кнопка фильтра заявок */
    button.tag { border:none; cursor:pointer; font:inherit; font-size:11px;
      font-weight:600; color:var(--chalk); }
    button.tag:hover { background:var(--plate); }

    /* ── Формы ── */
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:14px; margin-top:18px; }
    .f label { display:block; font-size:12px; color:var(--steel); margin-bottom:6px; }
    .f input, .f select, .f textarea { width:100%; min-height:40px; padding:9px 12px;
      background:var(--plate); border:none; border-radius:9px; }
    .f textarea { min-height:110px; resize:vertical; line-height:1.5; }
    .f input:focus, .f select:focus, .f textarea:focus {
      outline:2px solid var(--steel); outline-offset:-2px; }
    .f input.bad, .f textarea.bad { outline:1.5px solid var(--live); outline-offset:-1.5px; }
    .wide { grid-column:1/-1; }
    .err { color:var(--live); font-size:12px; margin-top:6px; }

    .btn { min-height:40px; padding:0 18px; border:none; border-radius:9px;
      background:var(--chalk); color:var(--void); font-weight:700; cursor:pointer; }
    .btn:disabled { background:var(--plate); color:var(--steel); cursor:default; }
    .btn.quiet { background:var(--plate); color:var(--chalk); font-weight:500; }
    .btn.link { background:none; color:var(--steel); padding:0 6px; font-weight:500;
      text-decoration:underline; text-underline-offset:3px; }
    .btn.link.danger { color:var(--live); }
    .bar { display:flex; gap:10px; align-items:center; margin-top:22px; }

    /* ── Картинки события ── */
    .imgs { display:flex; gap:16px; margin-top:18px; flex-wrap:wrap; }
    .img-slot { background:var(--plate); border-radius:10px; padding:12px; }
    .img-slot .label { font-size:12px; color:var(--steel); margin-bottom:8px; }
    .img-slot .prev { background:var(--plate2); border-radius:8px; overflow:hidden;
      display:grid; place-items:center; color:var(--steel); font-size:12px; }
    .img-slot.banner .prev { width:288px; height:162px; }
    .img-slot.mark .prev { width:96px; height:96px; border-radius:50%; }
    .img-slot img { width:100%; height:100%; object-fit:cover; }

    .note { color:var(--steel); padding:26px 0; }
    .toast { position:fixed; right:22px; bottom:22px; background:var(--chalk); color:var(--void);
      padding:11px 18px; border-radius:9px; font-weight:500; opacity:0;
      transition:opacity .18s; pointer-events:none; }
    .toast.show { opacity:1; }
    .warn { background:var(--plate); border-radius:10px; padding:14px 16px;
      margin-top:16px; color:var(--steel); }
    .warn b { color:var(--chalk); font-weight:500; }
  </style>
</head>
<body>

<div class="login" id="login">
  <form id="login-form">
    <h1>Админка</h1>
    <p class="muted">Кроссфит-платформа</p>
    <div class="f">
      <label for="pw">Пароль</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus />
      <div class="err" id="login-err" hidden>Пароль не подошёл</div>
    </div>
    <div class="bar"><button class="btn" type="submit">Войти</button></div>
  </form>
</div>

<div id="app" hidden>
  <div class="top">
    <b>Кроссфит-платформа</b>
    <span class="muted">админка</span>
    <span class="sp"></span>
    <button class="btn link" id="logout">Выйти</button>
  </div>
  <div class="wrap">
    <nav class="nav">
      <button data-page="events" aria-current="page">События</button>
      <button data-page="news">Новости</button>
      <button data-page="clubs">Клубы</button>
      <button data-page="partners">Партнёры</button>
    </nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let PW = sessionStorage.getItem('adminpw') || '';

  function toast(m) {
    const t = $('toast'); t.textContent = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  // Пароль уходит в base64: заголовки HTTP не переносят кириллицу,
  // и с русским паролем браузер просто откажется отправить запрос.
  const pwHeader = () => ({'X-Admin-Password-B64':
    btoa(String.fromCharCode(...new TextEncoder().encode(PW)))});

  async function api(path, opts = {}) {
    const headers = Object.assign(pwHeader(), opts.headers || {});
    if (opts.body) headers['Content-Type'] = 'application/json';
    try {
      const r = await fetch(path, Object.assign({}, opts, {headers}));
      if (r.status === 403) { logout(); return {error: 'forbidden'}; }
      return await r.json();
    } catch (e) { return {error: 'net'}; }
  }
  const send = (p, m, b) => api(p, {method: m, body: b === undefined ? undefined : JSON.stringify(b)});

  // ── Вход ──
  $('login-form').onsubmit = async e => {
    e.preventDefault();
    PW = $('pw').value;
    const r = await api('/api/admin/check');
    if (r.error) {
      $('login-err').hidden = false;
      $('login-err').textContent = r.error === 'forbidden'
        ? 'Пароль не подошёл. Если ADMIN_PASSWORD не задан в окружении — админка выключена.'
        : 'Сервер не ответил. Проверьте, что он запущен.';
      return;
    }
    sessionStorage.setItem('adminpw', PW);
    start();
  };
  function logout() {
    sessionStorage.removeItem('adminpw'); PW = '';
    $('app').hidden = true; $('login').hidden = false;
  }
  $('logout').onclick = logout;

  function start() {
    $('login').hidden = true; $('app').hidden = false;
    go('events');
  }

  let page = 'events';
  function go(name) {
    page = name;
    document.querySelectorAll('.nav button').forEach(b => {
      if (b.dataset.page === name) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    if (name === 'events') listEvents();
    if (name === 'news')   listNews();
    if (name === 'clubs')  listClubs();
    if (name === 'partners') listPartners();
  }
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => go(b.dataset.page));

  const STATUS = {draft:'Черновик', registration:'Регистрация', live:'Идёт', finished:'Завершено'};
  const RULE = {any:'Любой', male:'Мужской', female:'Женский', mixed:'Микс'};
  const LEVEL = {'':'—', bg:'Bg', inter:'Inter', rx:'Rx', elite:'Elite'};
  const NEWSCAT = {'':'Без раздела', ru:'CF Россия', world:'CF Мир'};
  const fmtMoney = v => v ? String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽' : 'Бесплатно';

  // Уменьшаем на клиенте: с диска прилетают файлы по 5–15 МБ
  function pickImage(w, h) {
    return new Promise(resolve => {
      const inp = Object.assign(document.createElement('input'), {type:'file', accept:'image/*'});
      inp.onchange = async () => {
        const file = inp.files?.[0];
        if (!file) return resolve(null);
        try {
          const bmp = await createImageBitmap(file);
          const scale = Math.max(w / bmp.width, h / bmp.height);
          const sw = w / scale, sh = h / scale;
          const cv = Object.assign(document.createElement('canvas'), {width:w, height:h});
          cv.getContext('2d').drawImage(
            bmp, (bmp.width - sw) / 2, (bmp.height - sh) / 2, sw, sh, 0, 0, w, h);
          resolve(cv.toDataURL('image/jpeg', .88));
        } catch (e) { toast('Не удалось прочитать файл'); resolve(null); }
      };
      inp.click();
    });
  }

  // ── События ──
  async function listEvents() {
    const m = $('main');
    m.innerHTML = '<div class="note">Загрузка…</div>';
    const list = await api('/api/admin/events');
    if (!Array.isArray(list)) { m.innerHTML = '<div class="note">Не загрузилось.</div>'; return; }
    m.innerHTML = `
      <div class="row-between">
        <div><h2>События</h2><div class="sub">${list.length} всего, включая черновики</div></div>
        <button class="btn" id="new-ev">Новое событие</button>
      </div>
      <table>
        <tr><th>Название</th><th>Город</th><th>Статус</th><th>Начало</th>
            <th>Картинки</th><th>Источник</th><th class="num">Див.</th><th class="num">Заявок</th></tr>
        ${list.map(e => `
          <tr class="click" data-id="${e.id}">
            <td><b>${esc(e.title)}</b><div class="muted">${esc(e.slug)}</div></td>
            <td>${esc(e.city) || '<span class="muted">—</span>'}</td>
            <td><span class="tag ${e.status === 'draft' ? 'off' : ''}">${STATUS[e.status] || e.status}</span></td>
            <td>${esc(e.date_start) || '<span class="muted">—</span>'}</td>
            <td>${e.has_banner ? '<span class="tag">афиша</span> ' : ''}${
                  e.has_mark ? '<span class="tag">знак</span>' : ''}${
                  !e.has_banner && !e.has_mark ? '<span class="muted">нет</span>' : ''}</td>
            <td>${e.feed_url ? '<span class="tag on">модуль</span>' : '<span class="muted">свои данные</span>'}</td>
            <td class="num">${e.divisions}</td><td class="num">${e.entries}</td>
          </tr>`).join('')}
      </table>`;
    $('new-ev').onclick = () => editEvent(null);
    m.querySelectorAll('tr.click').forEach(t => t.onclick = () => editEvent(t.dataset.id));
  }

  const F = (id, label, val, type = 'text', extra = '') => `
    <div class="f"><label for="${id}">${label}</label>
      <input id="${id}" type="${type}" value="${esc(val ?? '')}" ${extra} /></div>`;

  // Что должно быть у каждого старта. Организатор без него — не «пока пусто»,
  // а поломка: событие остаётся без хозяина, и роли не на кого повесить.
  function readyList(ev) {
    const r = ev.ready || {};
    const d = (ev.divisions || []).length;
    const items = [
      ['Организатор назначен', r.organizers, 'stf', true],
      ['Категории заведены', d, 'div', true],
      ['Афиша и знак', (ev.has_banner ? 1 : 0) + (ev.has_mark ? 1 : 0), 'set', false],
      ['Комплексы', r.wods, 'wod', false],
      ['Заходы', r.heats, 'hea', false],
      ['Расписание', r.schedule, 'sch', false],
      ['Судьи на площадке', r.judges, 'stf', false],
      ['Заявки', r.entries, 'ent', false],
      ['Реквизиты для оплаты', ev.pay_info ? 1 : 0, 'set', false],
      ['Внесено результатов', r.results, 'res', false],
    ];
    return `<div class="ready">
      ${items.map(([label, n, pane, must]) => `
        <a href="#" data-go="${pane}" class="${n ? 'ok' : (must ? 'warn-it' : 'no')}">
          <i>${n ? '✓' : (must ? '!' : '—')}</i><b>${label}</b>
          <span class="val">${n || 'нет'}</span>
        </a>`).join('')}
    </div>`;
  }

  const EV_TABS = [['set', 'Настройки'], ['div', 'Категории'], ['wod', 'Комплексы'],
                   ['hea', 'Заходы'], ['sch', 'Расписание'], ['res', 'Результаты'],
                   ['ent', 'Заявки'], ['stf', 'Судьи']];

  async function editEvent(id, pane = 'set') {
    const m = $('main');
    m.innerHTML = '<div class="note">Загрузка…</div>';
    const ev = id ? await api('/api/admin/events/' + id)
                  : {status:'draft', visibility:'public', divisions:[]};
    if (ev.error) { m.innerHTML = '<div class="note">Событие не найдено.</div>'; return; }

    m.innerHTML = `
      <div class="row-between">
        <div><h2>${id ? esc(ev.title) : 'Новое событие'}</h2>
             <div class="sub">${id ? esc(ev.slug) : 'Заполните название и сохраните'}</div></div>
        <button class="btn quiet" id="back">К списку</button>
      </div>

      ${id ? `<div class="etabs">${EV_TABS.map(([k, label]) =>
        `<button class="etab${k === pane ? ' on' : ''}" data-pane="${k}">${label}</button>`
      ).join('')}</div>` : ''}

      <div class="epane" id="p-set"${id && pane !== 'set' ? ' hidden' : ''}>
      <div class="grid">
        ${F('ev-title', 'Название', ev.title)}
        ${F('ev-city', 'Город', ev.city)}
        ${F('ev-venue', 'Площадка', ev.venue)}
        <div class="f"><label for="ev-status">Статус</label><select id="ev-status">
          ${Object.entries(STATUS).map(([k, v]) =>
            `<option value="${k}"${ev.status === k ? ' selected' : ''}>${v}</option>`).join('')}
        </select></div>
        <div class="f"><label for="ev-vis">Видимость</label><select id="ev-vis">
          <option value="public"${ev.visibility === 'public' ? ' selected' : ''}>В каталоге</option>
          <option value="link"${ev.visibility === 'link' ? ' selected' : ''}>Только по ссылке</option>
        </select></div>
        ${F('ev-ds', 'Начало', ev.date_start, 'date')}
        ${F('ev-de', 'Конец', ev.date_end, 'date')}
        ${F('ev-ro', 'Регистрация с', ev.reg_opens_at, 'date')}
        ${F('ev-rc', 'Регистрация до', ev.reg_closes_at, 'date')}
        ${F('ev-qs', 'Онлайн-отбор с', ev.qual_start, 'date')}
        ${F('ev-qe', 'Онлайн-отбор до', ev.qual_end, 'date')}
        ${F('ev-tg', 'Telegram', ev.telegram, 'url')}
        ${F('ev-ig', 'Instagram', ev.instagram, 'url')}
        <div class="f wide"><label for="ev-desc">Описание</label>
          <textarea id="ev-desc">${esc(ev.description)}</textarea></div>
        ${F('ev-payurl', 'Ссылка на оплату', ev.pay_url, 'url')}
        ${F('ev-paydays', 'Срок оплаты, дней', ev.pay_days ?? 3, 'number')}
        <div class="f wide"><label for="ev-payinfo">Как оплатить</label>
          <textarea id="ev-payinfo" placeholder="Перевод на карту 0000 0000 0000 0000, в комментарии фамилия и категория">${
            esc(ev.pay_info || '')}</textarea>
          <div class="muted">Платформа денег не принимает — этот текст атлет видит
            сразу после подачи заявки. Неоплаченная заявка держит место до срока,
            потом снимается автоматически.</div></div>
        <div class="f wide"><label for="ev-feed">Адрес соревновательного модуля</label>
          <input id="ev-feed" type="url" value="${esc(ev.feed_url)}"
                 placeholder="https://… — пусто, если турнир ведётся в платформе" /></div>

          <div class="prev" id="prev-banner">${ev.has_banner
            ? `<img src="/api/event-banner/${id}?t=${Date.now()}" alt="">` : 'нет'}</div>
          <div class="bar"><button class="btn quiet" id="up-banner">Загрузить</button></div>
        </div>
        <div class="img-slot mark">
          <div class="label">Знак 1:1 — кругом у названия</div>
          <div class="prev" id="prev-mark">${ev.has_mark
            ? `<img src="/api/event-mark/${id}?t=${Date.now()}" alt="">` : 'нет'}</div>
          <div class="bar"><button class="btn quiet" id="up-mark">Загрузить</button></div>
        </div>
      </div>
      ` : ''}
      </div>

      ${id ? `
      <div class="epane" id="p-div"${pane === 'div' ? '' : ' hidden'}>
        <div class="row-between">
          <h2>Категории</h2><button class="btn quiet" id="new-div">Добавить</button>
        </div>
        <div id="divs"></div>
        ${ev.feed_url ? `<div class="warn"><b>Турнир ведётся во внешнем модуле.</b>
          Протокол, комплексы, расписание и заходы приходят оттуда. Чтобы категория
          попала в протокол, заполните у неё «Категория в модуле» и «Пол в модуле» —
          модуль знает не её, а пару «категория + пол» в своих терминах.</div>` : ''}

      <div class="epane" id="p-wod"${pane === 'wod' ? '' : ' hidden'}>
        <div class="row-between">
          <h2>Комплексы</h2><button class="btn quiet" id="new-wod">Добавить</button>
        </div>
        <div id="wods"><div class="note">Загрузка…</div></div>
      </div>

      <div class="epane" id="p-hea"${pane === 'hea' ? '' : ' hidden'}>
        <div class="row-between">
          <h2>Заходы</h2><button class="btn quiet" id="new-heat">Добавить</button>
        </div>
        <div id="heats"><div class="note">Загрузка…</div></div>
      </div>

      <div class="epane" id="p-sch"${pane === 'sch' ? '' : ' hidden'}>
        <div class="row-between">
          <h2>Расписание</h2><button class="btn quiet" id="new-sched">Добавить</button>
        </div>
        <div id="sched"><div class="note">Загрузка…</div></div>
      </div>

      <div class="epane" id="p-res"${pane === 'res' ? '' : ' hidden'}>
        <h2>Результаты</h2>
        <div id="results"><div class="note">Загрузка…</div></div>
      </div>

      <div class="epane" id="p-ent"${pane === 'ent' ? '' : ' hidden'}>
        <h2>Заявки</h2>
        <div id="entries"><div class="note">Загрузка…</div></div>
      </div>

      <div class="epane" id="p-stf"${pane === 'stf' ? '' : ' hidden'}>
        <h2>Судьи и организаторы</h2>
        <div id="staff"><div class="note">Загрузка…</div></div>
      </div>` : ''}`;

    $('back').onclick = listEvents;
    $('ev-save').onclick = () => saveEvent(id);
    if (!id) return;
    $('up-banner').onclick = () => uploadEventImage(id, 'banner', 1600, 900);
    $('up-mark').onclick = () => uploadEventImage(id, 'mark', 512, 512);
    $('new-div').onclick = () => divRow(id, null);
    $('new-wod').onclick = () => wodForm(id, ev.divisions, null);
    $('new-heat').onclick = () => heatForm(id, ev.divisions, null);
    $('new-sched').onclick = () => schedForm(id, ev.divisions, null);

    // данные вкладки тянем при первом открытии, а не все сразу: сетка
    // результатов на сотню заявок не нужна тому, кто зашёл поправить дату
    const loaded = {};
    const open = k => {
      document.querySelectorAll('.etab').forEach(b => b.classList.toggle('on', b.dataset.pane === k));
      EV_TABS.forEach(([t]) => { $('p-' + t).hidden = t !== k; });
      if (loaded[k]) return;
      loaded[k] = true;
      if (k === 'div') renderDivs(id, ev.divisions, !!ev.feed_url);
      if (k === 'wod') loadWods(id, ev.divisions);
      if (k === 'hea') loadHeats(id, ev.divisions);
      if (k === 'sch') loadSchedule(id, ev.divisions);
      if (k === 'res') loadResults(id, ev.divisions);
      if (k === 'ent') loadEntries(id);
      if (k === 'stf') loadStaff(id);
    };
    document.querySelectorAll('.etab').forEach(b => b.onclick = () => open(b.dataset.pane));
    document.querySelectorAll('.ready [data-go]').forEach(a => a.onclick = e => {
      e.preventDefault();
      open(a.dataset.go);
      window.scrollTo(0, 0);
    });
    open(pane);
  }

  async function saveEvent(id) {
    const b = $('ev-save');
    const body = {
      title: $('ev-title').value, city: $('ev-city').value, venue: $('ev-venue').value,
      status: $('ev-status').value, visibility: $('ev-vis').value,
      date_start: $('ev-ds').value, date_end: $('ev-de').value,
      reg_opens_at: $('ev-ro').value, reg_closes_at: $('ev-rc').value,
      qual_start: $('ev-qs').value, qual_end: $('ev-qe').value,
      telegram: $('ev-tg').value, instagram: $('ev-ig').value,
      description: $('ev-desc').value, feed_url: $('ev-feed').value,
      pay_info: $('ev-payinfo').value, pay_url: $('ev-payurl').value,
      pay_days: $('ev-paydays').value,
    };
    b.disabled = true; b.textContent = 'Сохраняем…';
    const res = await send(id ? '/api/admin/events/' + id : '/api/admin/events',
                           id ? 'PUT' : 'POST', body);
    b.disabled = false; b.textContent = 'Сохранить';
    if (res.error) {
      const e = $('ev-err');
      e.hidden = false;
      e.textContent = Object.values(res.fields || {})[0] || 'Не сохранилось';
      return;
    }
    toast('Сохранено');
    // новое событие получает id только после сохранения — открываем его заново,
    // иначе картинки и категории некуда прикреплять
    if (!id) editEvent(res.id); else $('ev-err').hidden = true;
  }

  async function uploadEventImage(id, kind, w, h) {
    const data = await pickImage(w, h);
    if (!data) return;
    const res = await send(`/api/admin/events/${id}/image`, 'POST', {kind, data});
    if (res.error) { toast('Не загрузилось'); return; }
    const url = kind === 'banner' ? `/api/event-banner/${id}` : `/api/event-mark/${id}`;
    $('prev-' + kind).innerHTML = `<img src="${url}?t=${Date.now()}" alt="">`;
    toast(kind === 'banner' ? 'Афиша обновлена' : 'Знак обновлён');
  }

  function renderDivs(eid, divs, feed) {
    $('divs').innerHTML = !divs.length
      ? '<div class="note">Категорий нет. Без них нельзя подать заявку.</div>'
      : `<table>
          <tr><th>Название</th><th>Уровень</th><th>Состав</th><th>Пол</th>
              <th class="num">Цена</th><th class="num">Лимит</th>
              ${feed ? '<th>В модуле</th>' : ''}<th></th></tr>
          ${divs.map(d => `
            <tr data-id="${d.id}">
              <td><b>${esc(d.name)}</b></td>
              <td><span class="tag${d.level ? ' lv-' + d.level : ''}">${
                LEVEL[d.level] || d.level}</span></td>
              <td>${d.team_size > 1 ? `Команда ${d.team_size}` : 'Личный'}</td>
              <td>${RULE[d.gender_rule] || d.gender_rule}</td>
              <td class="num">${fmtMoney(d.price)}</td>
              <td class="num">${d.max_entries || '—'}</td>
              ${feed ? `<td>${d.feed_category
                ? esc(d.feed_category + ' / ' + (d.feed_gender || 'любой'))
                : '<span class="muted">не задано</span>'}</td>` : ''}
              <td><button class="btn link" data-edit="${d.id}">Изменить</button>
                  <button class="btn link danger" data-del="${d.id}">Удалить</button></td>
            </tr>`).join('')}
        </table>`;
    $('divs').querySelectorAll('[data-edit]').forEach(b => b.onclick = () =>
      divRow(eid, divs.find(x => String(x.id) === b.dataset.edit)));
    $('divs').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      const res = await send('/api/admin/divisions/' + b.dataset.del, 'DELETE');
      if (res.error === 'has_entries') {
        toast(`Нельзя удалить: в категории ${res.entries} заявок`); return;
      }
      if (res.error) { toast('Не удалилось'); return; }
      toast('Категория удалена'); editEvent(eid);
    });
  }

  // ── Комплексы ──
  const RTYPE = {time: 'Время', reps: 'Повторы', weight: 'Вес'};
  const STAGE = {qualification: 'Квалификация', semifinal: 'Полуфинал', final: 'Финал'};

  async function loadWods(eid, divs) {
    const box = $('wods');
    const list = await api(`/api/admin/events/${eid}/wods`);
    if (!Array.isArray(list)) { box.innerHTML = '<div class="note">Не загрузилось.</div>'; return; }
    if (!list.length) {
      box.innerHTML = '<div class="note">Комплексов нет. Без них протокол пустой.</div>';
      return;
    }
    const dname = Object.fromEntries(divs.map(d => [d.id, d.name]));
    box.innerHTML = `<table>
      <tr><th>#</th><th>Название</th><th>День</th><th>Этап</th><th>Результат</th>
          <th>Кап</th><th>Категории</th><th>Баллы</th><th></th></tr>
      ${list.map(w => `
        <tr class="click" data-w="${w.id}">
          <td class="num">${w.ord}</td>
          <td><b>${esc(w.name)}</b>${w.scoring_note
            ? `<div class="muted">${esc(w.scoring_note)}</div>` : ''}</td>
          <td>${esc((w.day || '').slice(0, 10) || '—')}</td>
          <td>${esc(STAGE[w.stage] || w.stage)}</td>
          <td>${esc(RTYPE[w.result_type] || w.result_type)}</td>
          <td>${esc(w.time_cap || '—')}</td>
          <td>${w.divisions.length
            ? w.divisions.map(x => `<span class="tag">${esc(dname[x] || x)}</span>`).join(' ')
            : '<span class="tag off">все</span>'}</td>
          <td>${w.points_table
            ? `<span class="muted">${esc(w.points_table)}</span>` : '100 − 5×(место−1)'}</td>
          <td><button class="btn link danger" data-del="${w.id}">Удалить</button></td>
        </tr>`).join('')}
    </table>`;
    box.querySelectorAll('[data-w]').forEach(tr => tr.onclick = e => {
      if (e.target.dataset.del) return;
      wodForm(eid, divs, list.find(x => x.id === +tr.dataset.w));
    });
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      if (!confirm('Удалить комплекс?')) return;
      const res = await send('/api/admin/wods/' + b.dataset.del, 'DELETE');
      if (res.error === 'has_results') {
        toast(`Нельзя удалить: внесено результатов — ${res.results}`); return;
      }
      if (res.error) { toast('Не получилось'); return; }
      toast('Комплекс удалён'); loadWods(eid, divs);
    });
  }

              stage: 'qualification', points_table: '', scoring_note: '',
              description: '', divisions: []};
    const box = $('wods');
    const prev = box.innerHTML;
    box.innerHTML = `
      <div class="row-between">
        <h2>${w.id ? 'Комплекс' : 'Новый комплекс'}</h2>

      </div>
      <div class="grid">
        ${F('w-name', 'Название', w.name)}
        ${F('w-ord', 'Порядок', w.ord, 'number')}
        ${F('w-day', 'День', (w.day || '').slice(0, 10), 'date')}
        <div class="f"><label for="w-stage">Этап</label><select id="w-stage">

            в ноль на 21-м месте — если в категории людей больше, хвост

        name: $('w-name').value, ord: $('w-ord').value, day: $('w-day').value,

      toast('Сохранено');

    if (!evEntries) evEntries = await api(`/api/admin/events/${eid}/entries`);
    return Array.isArray(evEntries) ? evEntries.filter(x => x.status === 'active') : [];
  }

    const box = $('heats');
    const [list, wods] = await Promise.all([
      api(`/api/admin/events/${eid}/heats`),
      api(`/api/admin/events/${eid}/wods`),

    const fill = `
      <div class="grid" style="margin-bottom:18px">
        <div class="f"><label for="hf-div">Разбить по заходам</label>
          <select id="hf-div">${divs.map(d =>
            `<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div>
        <div class="f"><label for="hf-wod">Комплекс</label>
          <select id="hf-wod">${(wods || []).map(w =>
            `<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select></div>

          <th>Площадка</th><th>Состав</th><th></th></tr>

        <tr class="click" data-h="${h.id}">
          <td><b>${esc(h.wod_name || '—')}</b></td>
          <td class="num">${h.number}</td>
          <td>${esc(h.day.slice(0, 10) || '—')}</td>
          <td>${esc([h.briefing_start, h.briefing_end].filter(Boolean).join('–') || '—')}</td>

        </tr>`).join('')}
    </table>` : '<div class="note">Заходов нет.</div>');

    if (wods && wods.length) $('hf-go').onclick = async () => {

        division_id: +$('hf-div').value, wod_id: +$('hf-wod').value,
        lanes: +$('hf-lanes').value,

      toast(`Создано заходов: ${res.heats} на ${res.entries} заявок`);
      loadHeats(eid, divs);
    };
    box.querySelectorAll('[data-h]').forEach(tr => tr.onclick = e => {
      if (e.target.dataset.del) return;
      heatForm(eid, divs, list.find(x => x.id === +tr.dataset.h), wods);
    });
    box.querySelectorAll('[data-del]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      if (!confirm('Удалить заход?')) return;
      if ((await send('/api/admin/heats/' + b.dataset.del, 'DELETE')).error) {
        toast('Не получилось'); return;
      }
      toast('Заход удалён'); loadHeats(eid, divs);
    });
  }

  async function heatForm(eid, divs, h, wods) {
    wods = wods || await api(`/api/admin/events/${eid}/wods`) || [];
    const ents = await entriesOf(eid);
    h = h || {wod_id: null, number: 1, day: '', briefing_start: '', briefing_end: '',

  // ── Результаты ──
  // Одна ячейка — один результат. Статус пишется словом прямо в поле: на площадке
  // быстрее набрать «dnf», чем лезть в выпадающий список рядом с каждой клеткой.
  const STATUS_WORD = {dnf: 'dnf', dns: 'dns', cap: 'cap', 'не закончил': 'dnf',
                       'не вышел': 'dns', 'кап': 'cap'};

  function parseVal(raw, type) {
    const t = String(raw).trim().toLowerCase().replace(',', '.');
    if (!t) return {value: null, status: 'ok'};
    if (STATUS_WORD[t]) return {value: null, status: STATUS_WORD[t]};
    if (type === 'time') {
      const m = t.match(/^(\d{1,3}):([0-5]\d)$/);
      if (m) return {value: +m[1] * 60 + +m[2], status: 'ok'};
    }
    if (/^\d+(\.\d+)?$/.test(t)) return {value: +t, status: 'ok'};
    return null;                              // не разобрали
  }

  function fmtVal(v, status, type) {
    if (status && status !== 'ok') return status.toUpperCase();
    if (v === null || v === undefined) return '';
    if (type === 'time') {
      const t = Math.round(v);
      return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
    }
    return String(+v);
  }

  async function loadResults(eid, divs, did) {
    const box = $('results');
    if (!divs.length) {
      box.innerHTML = '<div class="note">Сначала заведите категории.</div>'; return;
    }
    did = did || divs[0].id;
    const g = await api(`/api/admin/events/${eid}/results?division=${did}`);
    if (g.error) { box.innerHTML = '<div class="note">Не загрузилось.</div>'; return; }

    const picker = `<div class="grid">
      <div class="f"><label for="r-div">Категория</label>
        <select id="r-div">${divs.map(d =>
          `<option value="${d.id}"${d.id === did ? ' selected' : ''}>${esc(d.name)}</option>`
        ).join('')}</select></div>
      <div class="f"><label for="r-find">Найти участника</label>
        <input id="r-find" placeholder="Фамилия" autocomplete="off"></div>
    </div>`;

    if (!g.wods.length || !g.rows.length) {
      box.innerHTML = picker + `<div class="note">${!g.wods.length
        ? 'У этой категории нет комплексов — заведите их на вкладке «Комплексы».'
        : 'В этой категории нет заявок.'}</div>`;
      $('r-div').onchange = e => loadResults(eid, divs, +e.target.value);
      return;
    }

    box.innerHTML = picker + `
      <div class="muted" style="margin:10px 0 14px">
        Время «мм:сс», вес и повторы числом. Статус — словом: <b>dnf</b>, <b>dns</b>,
        <b>cap</b>. Пустое поле стирает результат. Enter и стрелки ↑↓ — по столбцу,
        Tab — по строке. Баллы и места считаются сами.
      </div>
      <div class="grid-res"><table>
        <tr><th>#</th><th>Участник</th>
          ${g.wods.map(w => `<th class="wod">${esc(w.name)}<div class="muted">${
            esc(RTYPE[w.result_type] || w.result_type)}</div></th>`).join('')}
          <th class="num">Сумма</th></tr>
        ${g.rows.map(r => `
          <tr data-e="${r.entry_id}">
            <td class="num">${r.place}</td>
            <td><b>${esc(r.name)}</b></td>
            ${r.wods.map(w => `
              <td class="cell">
                <input class="val" data-e="${r.entry_id}" data-w="${w.wod_id}"
                       data-t="${w.result_type}"
                       value="${esc(fmtVal(w.value, w.status, w.result_type))}">
                <div class="pts">${w.place ? `${w.place} место · <b>${w.points}</b>` : ''}</div>
              </td>`).join('')}
            <td class="num"><b>${r.points}</b></td>
          </tr>`).join('')}
      </table></div>`;

    $('r-div').onchange = e => loadResults(eid, divs, +e.target.value);

    // поиск по фамилии: в дивизионе на сотню человек своего глазами не найти,
    // а ввод идёт заходами — судья приходит с листком из пяти фамилий
    const rows = [...box.querySelectorAll('#results table tr[data-e]')];
    $('r-find').oninput = e => {
      const q = e.target.value.trim().toLowerCase();
      let shown = 0;
      rows.forEach(tr => {
        const hit = !q || tr.children[1].textContent.toLowerCase().includes(q);
        tr.hidden = !hit;
        if (hit) shown++;
      });
      $('r-find').classList.toggle('bad', !!q && !shown);
    };

    const cells = [...box.querySelectorAll('input.val')];
    const cols = g.wods.length;
    cells.forEach((inp, i) => {
      inp.onkeydown = e => {
        const step = e.key === 'Enter' || e.key === 'ArrowDown' ? cols
                   : e.key === 'ArrowUp' ? -cols : 0;
        if (!step) return;
        e.preventDefault();
        inp.blur();
        (cells[i + step] || inp).focus();
      };
      inp.onchange = async () => {
        const parsed = parseVal(inp.value, inp.dataset.t);
        inp.classList.remove('ok', 'bad');
        if (!parsed) { inp.classList.add('bad'); return; }
        const res = await send('/api/admin/results', 'POST', {
          entry_id: +inp.dataset.e, wod_id: +inp.dataset.w,
          value: parsed.value, status: parsed.status,
        });
        if (res.error) { inp.classList.add('bad'); toast('Не сохранилось'); return; }
        inp.classList.add('ok');
        // пересчитываем всю сетку: место и баллы соседей меняются от одной ячейки
        const focus = [inp.dataset.e, inp.dataset.w];
        await loadResults(eid, divs, did);
        const back = $('results').querySelector(
          `input.val[data-e="${focus[0]}"][data-w="${focus[1]}"]`);
        if (back) { back.classList.add('ok'); back.focus(); back.select(); }
      };
    });
  }

  let entryCat = '*', entryPay = '*';

  async function loadEntries(eid) {
    const box = $('entries');
    const list = await api(`/api/admin/events/${eid}/entries`);
    if (!Array.isArray(list)) { box.innerHTML = '<div class="note">Не загрузилось.</div>'; return; }
    if (!list.length) { box.innerHTML = '<div class="note">Заявок пока нет.</div>'; return; }
    const active = list.filter(x => x.status === 'active').length;
    // фильтр по категориям: в списке на сотню заявок глазами свою группу не найти
    const cats = [...new Set(list.map(x => x.division))].sort();
    const today = new Date().toISOString().slice(0, 10);
    const PAYF = {
      '*': () => true,
      unpaid: x => x.status === 'active' && x.payment_status !== 'paid',
      late: x => x.status === 'active' && x.payment_status !== 'paid'
                 && x.pay_due && x.pay_due < today,
      paid: x => x.payment_status === 'paid',
    };
    const shown = list.filter(x => (entryCat === '*' || x.division === entryCat)
                                   && PAYF[entryPay](x));
    box.innerHTML = `
      <div class="sub">${active} активных из ${list.length}</div>
      <div class="checks" style="margin-bottom:10px">
        ${[['*','Любая оплата'],['unpaid','Ждут оплаты'],['late','Просрочены'],['paid','Оплачены']]
          .map(([k, label]) => `<button class="tag${entryPay === k ? ' on' : ''}" data-pay-f="${k}">${
            label} ${list.filter(PAYF[k]).length}</button>`).join('')}
      </div>
      <div class="checks" style="margin-bottom:14px">
        <button class="tag${entryCat === '*' ? ' on' : ''}" data-cat="*">Все ${list.length}</button>
        ${cats.map(c => `<button class="tag${entryCat === c ? ' on' : ''}" data-cat="${esc(c)}">${
          esc(c)} ${list.filter(x => x.division === c).length}</button>`).join('')}
      </div>
      <table>
        <tr><th>Участник</th><th>Категория</th><th>Город</th><th>Подана</th>
            <th>Оплата</th><th>Статус</th><th></th></tr>
        ${shown.map(e => `
          <tr>
            <td><b>${esc(e.team_name || e.members[0] || '—')}</b>${
              e.team_name || e.members.length > 1
                ? `<div class="muted">${esc(e.members.join(', '))}</div>` : ''}</td>
            <td>${esc(e.division)}</td>
            <td>${esc(e.cities[0] || '—')}</td>
            <td>${esc((e.created_at || '').slice(0, 10))}</td>
            <td>${e.payment_status === 'paid'
              ? '<span class="tag on">Оплачена</span>'
              : `<span class="tag${e.pay_due && e.pay_due < today ? ' late' : ''}">${
                  e.pay_due ? 'до ' + esc(e.pay_due.slice(5)) : 'не оплачена'}</span>`}
              <button class="btn link" data-pay="${e.id}" data-to="${
                e.payment_status === 'paid' ? '0' : '1'}">${
                e.payment_status === 'paid' ? 'снять отметку' : 'отметить'}</button></td>
            <td><span class="tag ${e.status === 'active' ? '' : 'off'}">${
              e.status === 'active' ? 'Активна'
                : e.withdraw_reason === 'unpaid' ? 'Снята: не оплачена' : 'Снята'}</span></td>
            <td><button class="btn link${e.status === 'active' ? ' danger' : ''}"
                        data-en="${e.id}" data-to="${e.status === 'active' ? 'withdrawn' : 'active'}">${
              e.status === 'active' ? 'Снять' : 'Вернуть'}</button></td>
          </tr>`).join('')}
      </table>`;
    box.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
      entryCat = b.dataset.cat;
      loadEntries(eid);
    });
    box.querySelectorAll('[data-pay-f]').forEach(b => b.onclick = () => {
      entryPay = b.dataset.payF;
      loadEntries(eid);
    });
    box.querySelectorAll('[data-pay]').forEach(b => b.onclick = async () => {
      const res = await send(`/api/admin/entries/${b.dataset.pay}/payment`, 'POST',
                             {paid: b.dataset.to === '1'});
      if (res.error) { toast('Не получилось'); return; }
      toast(b.dataset.to === '1' ? 'Отмечена оплата' : 'Отметка снята');
      loadEntries(eid);
    });
    box.querySelectorAll('[data-en]').forEach(b => b.onclick = async () => {
      const res = await send('/api/admin/entries/' + b.dataset.en, 'POST', {status: b.dataset.to});
      if (res.error) { toast('Не получилось'); return; }
      toast(b.dataset.to === 'active' ? 'Заявка возвращена' : 'Заявка снята');
      loadEntries(eid);
    });
  }

        ${list.map(n => `
          <tr>
            <td><b>${esc(n.title)}</b><div class="muted">${esc(n.summary)}</div></td>
            <td>${n.status === 'draft' ? '<span class="tag on">Черновик</span>'
                 : n.status === 'rejected' ? '<span class="tag off">Отклонена</span>'
                 : '<span class="tag">В эфире</span>'}${
                 n.partner_id ? '<div class="muted">из канала</div>' : ''}</td>
            <td>${n.category ? `<span class="tag">${NEWSCAT[n.category]}</span>`
                              : '<span class="muted">—</span>'}</td>
            <td>${esc(n.published_at.slice(0, 10))}</td>
            <td>${n.has_image ? '<span class="tag">есть</span>' : '<span class="muted">нет</span>'}</td>
            <td>${n.is_featured ? '<span class="tag on">да</span>' : '<span class="muted">нет</span>'}</td>
            <td>${n.status === 'draft'
                  ? `<button class="btn link" data-pub="${n.id}">Опубликовать</button>
                     <button class="btn link danger" data-rej="${n.id}">Отклонить</button>`
                  : ''}
                <button class="btn link" data-ed="${n.id}">Изменить</button>
                <button class="btn link danger" data-del="${n.id}">Удалить</button></td>
          </tr>`).join('')}
      </table>`;
    $('new-news').onclick = () => editNews(null);
    m.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => editNews(b.dataset.ed, list));
    const setStatus = async (id, status, msg) => {
      const res = await send(`/api/admin/news/${id}/status`, 'POST', {status});
      if (res.error) { toast('Не получилось'); return; }
      toast(msg); listNews();
    };
    m.querySelectorAll('[data-pub]').forEach(b => b.onclick = () =>
      setStatus(b.dataset.pub, 'published', 'Опубликована'));
    m.querySelectorAll('[data-rej]').forEach(b => b.onclick = () =>
      setStatus(b.dataset.rej, 'rejected', 'Отклонена'));
    m.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('Удалить новость? Отменить нельзя.')) return;
      await send('/api/admin/news/' + b.dataset.del, 'DELETE');
      toast('Новость удалена'); listNews();
    });
  }

  async function editNews(id, list) {
    const n = id ? (list || []).find(x => String(x.id) === String(id)) || {} : {};
    const full = id ? await api('/api/news/' + id) : {};
    const m = $('main');
    m.innerHTML = `
      <div class="row-between">
        <h2>${id ? 'Новость' : 'Новая новость'}</h2>
        <button class="btn quiet" id="n-back">К списку</button>
      </div>
      <div class="grid">
        ${F('n-title', 'Заголовок', full.title ?? n.title)}
        ${F('n-url', 'Ссылка на первоисточник', full.source_url ?? n.source_url, 'url')}
        <div class="f wide"><label for="n-sum">Краткое описание — видно в списке и в слайдере</label>
          <input id="n-sum" value="${esc(full.summary ?? n.summary ?? '')}" /></div>
        <div class="f wide"><label for="n-body">Текст</label>
          <textarea id="n-body">${esc(full.body ?? '')}</textarea></div>
        <div class="f"><label for="n-cat">Раздел</label><select id="n-cat">
          ${Object.entries(NEWSCAT).map(([k, v]) =>
            `<option value="${k}"${(full.category ?? n.category ?? '') === k ? ' selected' : ''}>${v}</option>`).join('')}
        </select></div>
        <div class="f"><label for="n-feat">В слайдере на главной</label><select id="n-feat">
          <option value="0">Нет</option>
          <option value="1"${(full.is_featured ?? n.is_featured) ? ' selected' : ''}>Да</option>
        </select></div>
      </div>
      <div class="err" id="n-err" hidden></div>
      <div class="bar"><button class="btn" id="n-save">Сохранить</button></div>
      ${id ? `
      <div class="imgs">
        <div class="img-slot banner">
          <div class="label">Картинка 16:9</div>
          <div class="prev" id="prev-news">${(full.has_image ?? n.has_image)
            ? `<img src="/api/news-image/${id}?t=${Date.now()}" alt="">` : 'нет'}</div>
          <div class="bar"><button class="btn quiet" id="up-news">Загрузить</button></div>
        </div>
      </div>` : '<div class="warn">Картинку можно загрузить после сохранения.</div>'}`;
    $('n-back').onclick = listNews;
    $('n-save').onclick = async () => {
      const body = {title: $('n-title').value, summary: $('n-sum').value,
                    body: $('n-body').value, source_url: $('n-url').value,
                    category: $('n-cat').value,
                    is_featured: $('n-feat').value === '1'};
      const res = await send(id ? '/api/admin/news/' + id : '/api/admin/news',
                             id ? 'PUT' : 'POST', body);
      if (res.error) {
        const e = $('n-err'); e.hidden = false;
        e.textContent = Object.values(res.fields || {})[0] || 'Не сохранилось';
        return;
      }
      toast('Сохранено');
      if (!id) editNews(res.id, [{id: res.id}]); else $('n-err').hidden = true;
    };
    if (id) $('up-news').onclick = async () => {
      const data = await pickImage(1200, 675);
      if (!data) return;
      const res = await send(`/api/admin/news/${id}/image`, 'POST', {data});
      if (res.error) { toast('Не загрузилось'); return; }
      $('prev-news').innerHTML = `<img src="/api/news-image/${id}?t=${Date.now()}" alt="">`;
      toast('Картинка обновлена');
    };
  }

  // ── Клубы ──
  async function listClubs() {
    const m = $('main');
    m.innerHTML = '<div class="note">Загрузка…</div>';
    const list = await api('/api/admin/clubs');
    if (!Array.isArray(list)) { m.innerHTML = '<div class="note">Не загрузилось.</div>'; return; }
    m.innerHTML = `
      <div class="row-between">
        <div><h2>Клубы</h2>
          <div class="sub">Справочник для профиля атлета. «Независимый атлет» —
            это отсутствие клуба, отдельной записью не заводится</div></div>
      </div>
      <div class="grid" style="max-width:640px">
        ${F('c-name', 'Название', '')}
        ${F('c-city', 'Город', '')}
        <div class="f"><label>&nbsp;</label><button class="btn" id="c-add">Добавить</button></div>
      </div>
      <table>
        <tr><th>Название</th><th>Город</th><th class="num">Атлетов</th><th>Показывать</th><th></th></tr>
        ${list.map(c => `
          <tr data-id="${c.id}">
            <td><b>${esc(c.name)}</b></td>
            <td>${esc(c.city) || '<span class="muted">—</span>'}</td>
            <td class="num">${c.athletes}</td>
            <td><span class="tag ${c.is_active ? '' : 'off'}">${c.is_active ? 'да' : 'скрыт'}</span></td>
            <td><button class="btn link" data-toggle="${c.id}" data-active="${c.is_active ? 1 : 0}">${
              c.is_active ? 'Скрыть' : 'Показать'}</button></td>
          </tr>`).join('')}
      </table>`;
    $('c-add').onclick = async () => {
      const res = await send('/api/admin/clubs', 'POST',
                             {name: $('c-name').value, city: $('c-city').value, is_active: true});
      if (res.error) { toast(Object.values(res.fields || {})[0] || 'Не сохранилось'); return; }
      toast('Клуб добавлен'); listClubs();
    };
    m.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
      const row = list.find(x => String(x.id) === b.dataset.toggle);
      await send('/api/admin/clubs/' + row.id, 'PUT',
                 {name: row.name, city: row.city, is_active: !row.is_active});
      listClubs();
    });
  }

  // ── Медиа-партнёры ──
  const PLACES = {header:'Подпись в новостях', article:'Конец статьи', feed:'Конец ленты'};

  async function listPartners() {
    const m = $('main');
    m.innerHTML = '<div class="note">Загрузка…</div>';
    const list = await api('/api/admin/partners');
    if (!Array.isArray(list)) { m.innerHTML = '<div class="note">Не загрузилось.</div>'; return; }
    m.innerHTML = `
      <div class="row-between">
        <div><h2>Медиа-партнёры</h2>
          <div class="sub">Раздел новостей. Активным может быть только один —
            берётся первый включённый</div></div>
        <button class="btn" id="new-pt">Добавить</button>
      </div>
      ${list.map(p => `
        <div style="margin-top:22px">
          <div class="grid" style="max-width:760px">
            ${F('p-name-' + p.id, 'Название', p.name)}
            ${F('p-tag-' + p.id, 'Подпись', p.tagline)}
            ${F('p-url-' + p.id, 'Ссылка на канал', p.url, 'url')}
            ${F('p-aud-' + p.id, 'Аудитория', p.audience)}
            ${F('p-chan-' + p.id, 'Канал в Telegram (без @)', p.channel)}
            <div class="f"><label for="p-imp-${p.id}">Забирать посты</label>
              <select id="p-imp-${p.id}">
                <option value="off"${p.import_mode === 'off' ? ' selected' : ''}>Нет</option>
                <option value="draft"${p.import_mode === 'draft' ? ' selected' : ''}>Да, в черновики</option>
              </select></div>
            <div class="f"><label for="p-act-${p.id}">Показывать</label>
              <select id="p-act-${p.id}">
                <option value="1"${p.is_active ? ' selected' : ''}>Да</option>
                <option value="0"${p.is_active ? '' : ' selected'}>Нет</option>
              </select></div>
          </div>
          <div class="imgs">
            <div class="img-slot mark">
              <div class="label">Логотип 1:1 — кругом в подписи</div>
              <div class="prev" id="pt-prev-${p.id}">${p.has_logo
                ? `<img src="/api/partner-logo/${p.id}?t=${Date.now()}" alt="">` : 'нет'}</div>
              <div class="bar"><button class="btn quiet" data-ptlogo="${p.id}">Загрузить</button></div>
            </div>
          </div>
          <table style="max-width:520px">
            <tr><th>Размещение</th><th class="num">Переходов</th></tr>
            ${Object.entries(PLACES).map(([k, v]) => `
              <tr><td>${v}</td><td class="num">${p.clicks[k] || 0}</td></tr>`).join('')}
            <tr><td><b>Всего</b></td><td class="num"><b>${p.clicks_total}</b></td></tr>
          </table>
          <div class="bar"><button class="btn" data-ptsave="${p.id}">Сохранить</button>
            <button class="btn quiet" id="pt-import">Забрать посты сейчас</button></div>
          <div class="warn">Всё забранное попадает в <b>черновики</b> и ждёт решения
            в разделе «Новости». Автопубликации нет: в авторском канале рядом
            с новостями идут личные посты.</div>
        </div>`).join('') || '<div class="note">Партнёров нет.</div>'}`;

    $('new-pt').onclick = async () => {
      const name = prompt('Название партнёра');
      if (!name) return;
      const res = await send('/api/admin/partners', 'POST', {name, is_active: true});
      if (res.error) { toast('Не сохранилось'); return; }
      listPartners();
    };
    m.querySelectorAll('[data-ptsave]').forEach(b => b.onclick = async () => {
      const id = b.dataset.ptsave;
      const res = await send('/api/admin/partners/' + id, 'PUT', {
        name: $('p-name-' + id).value, tagline: $('p-tag-' + id).value,
        url: $('p-url-' + id).value, audience: $('p-aud-' + id).value,
        channel: $('p-chan-' + id).value, import_mode: $('p-imp-' + id).value,
        is_active: $('p-act-' + id).value === '1'});
      if (res.error) { toast(Object.values(res.fields || {})[0] || 'Не сохранилось'); return; }
      toast('Сохранено');
    });
    const imp = $('pt-import');
    if (imp) imp.onclick = async () => {
      imp.disabled = true; imp.textContent = 'Забираем…';
      const res = await send('/api/admin/news-import', 'POST', {});
      imp.disabled = false; imp.textContent = 'Забрать посты сейчас';
      if (res.error) { toast(res.error === 'no_channel' ? 'Канал не задан' : res.error); return; }
      toast(`Добавлено ${res.added}, уже было ${res.skipped}`);
    };
    m.querySelectorAll('[data-ptlogo]').forEach(b => b.onclick = async () => {
      const id = b.dataset.ptlogo;
      const data = await pickImage(512, 512);
      if (!data) return;
      const res = await send(`/api/admin/partners/${id}/logo`, 'POST', {data});
      if (res.error) { toast('Не загрузилось'); return; }
      $('pt-prev-' + id).innerHTML = `<img src="/api/partner-logo/${id}?t=${Date.now()}" alt="">`;
      toast('Логотип обновлён');
    });
  }

  // ── Старт ──
  (async () => {
    if (!PW) return;
    const r = await api('/api/admin/check');
    if (!r.error) start();
  })();
</script>
</body>
</html>
