      if (evTab === 'wods')     loadWods(ev);
      if (evTab === 'schedule') loadSchedule(ev);
      if (evTab === 'heats')    loadHeats(ev);
    }

    function renderOverview(ev) {
      const box = $('event-body');

      const hero = heroFact(ev);
      const place = [ev.city, ev.venue].filter(Boolean).join(', ');

      // Личный зачёт — умолчание, и подписывать его в каждой строке незачем.
      // Отмечаем только исключение: командная категория и размер команды.
      const list = ev.divisions || [];
      const divs = list.map(d => `
        <div class="row">
          <div class="row-main">${paintLevel(d.name, d.level)}</div>
          ${d.team_size > 1
            ? `<div class="row-val q">Команда, ${d.team_size} чел.</div>` : ''}
        </div>`).join('');

      const chev = `<svg width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1.5 6 6.5 11 1.5"/></svg>`;
      // Одна категория — это не выбор, прятать её под раскрывашку не за чем
      const divBlock = !list.length
        ? '<div class="h">Категории</div><div class="note">Категории пока не объявлены.</div>'
        : list.length === 1
          ? `<div class="h">Категории</div><div class="rows">${divs}</div>`
          : `<button class="h h-toggle" aria-expanded="false"
                     aria-controls="divs-list">Категории<span class="h-side">${
                       list.length}${chev}</span></button>
             <div class="rows" id="divs-list" hidden>${divs}</div>`;

      // Регистрация уехала в главный факт — здесь её уже не повторяем.
      // Отбор идёт раньше очных дней, поэтому стоит первым. «Финал» — только
      // когда отбор есть: у турнира без отбора очные дни это всё соревнование,
      // а не его финальная часть.
      const mainDates = fmtDates(ev.date_start, ev.date_end);
      const qualDates = fmtDates(ev.qual_start, ev.qual_end);
      const dates = [
        ['Онлайн-отбор', qualDates],
        [qualDates ? 'Финал' : 'Соревнование', mainDates],
      ].filter(([, v]) => v).map(([k, v]) =>
        `<div class="row"><div class="row-main">${esc(k)}</div><div class="row-val num">${esc(v)}</div></div>`).join('');

      const links = [
        ev.telegram  ? `<a href="${esc(ev.telegram)}" target="_blank" rel="noopener">Telegram</a>` : '',
        ev.instagram ? `<a href="${esc(ev.instagram)}" target="_blank" rel="noopener">Instagram</a>` : '',
      ].filter(Boolean).join('');

      box.innerHTML = `
        <div class="art">${artHTML(ev)}</div>
        <div class="ev-head">
          <div class="mark">${markHTML(ev)}</div>
          <h1 class="ev-title">${esc(ev.title)}</h1>
          ${place ? `<div class="ev-place">${esc(place)}</div>` : ''}
        </div>

        <div class="hero">
          <div class="hero-label${hero.live ? ' live' : ''}">${
            hero.live ? '<i class="dot live"></i>' : ''}${esc(hero.label)}</div>
          <div class="hero-value${
            hero.value.length > 14 ? ' xlong' : hero.value.length > 9 ? ' long' : ''
          }">${esc(hero.value)}</div>
          ${feeLine(ev)}
        </div>

        <div style="padding-top:22px">${actionBlock(ev)}</div>

        ${ev.description ? `<div class="pad"><p class="ev-desc">${esc(ev.description)}</p></div>` : ''}

        ${divBlock}

        ${dates ? `<button class="h h-toggle" aria-expanded="false"
              aria-controls="dates-list">Даты проведения<span class="h-side"><span
              class="h-sum">${esc(mainDates || qualDates)}</span>${chev}</span></button>
            <div class="rows" id="dates-list" hidden>${dates}</div>` : ''}
        ${links ? `<div class="h">Организатор</div><div class="pad links">${links}</div>` : ''}
        <div style="height:32px"></div>`;

      wireActions(ev);
      box.querySelectorAll('.h-toggle').forEach(t => t.onclick = () => {
        const open = t.getAttribute('aria-expanded') === 'true';
        t.setAttribute('aria-expanded', String(!open));
        $(t.getAttribute('aria-controls')).hidden = open;
      });
    }

    // Стоимость участия одной цифрой. «от» появляется, только когда цены
    // категорий расходятся; бесплатная категория рядом с платными «от» описать
    // нельзя, поэтому там честный диапазон.
    function feeLine(ev) {
      const p = (ev.divisions || []).map(d => d.price)
        .filter(v => v !== null && v !== undefined);
      if (!p.length) return '';
      const min = Math.min(...p), max = Math.max(...p);
      const sum = min === max ? money(min)
                : min === 0   ? `Бесплатно — ${money(max)}`
                              : `от ${money(min)}`;
      return `<div class="hero-fee">Участие<span>${esc(sum)}</span></div>`;
    }

    // Модуль соревнования недоступен — это не «данных нет», а «нет связи»:
    // во время старта разница принципиальная.
    const FEED_DOWN = `<div class="note">Связи с системой соревнования нет.<br>
      Данные появятся, как только она ответит.</div>`;

    // ── Лидерборд ──
    const RES_LABEL = {time:'Время', reps:'Повторы', weight:'Вес'};
    const STATUS_LABEL = {dnf:'Не закончил', dns:'Не вышел', cap:'Не уложился'};
    const STAGE_LABEL = {qualification:'Квалификация', semifinal:'Полуфинал', final:'Финал'};

    // Время храним в секундах, вес в килограммах, повторы числом
    function fmtValue(v, type, status) {
      if (status && status !== 'ok') return STATUS_LABEL[status] || '—';
      if (v === null || v === undefined) return '—';
      if (type === 'time') {
        const t = Math.round(v);
        return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
      }
      if (type === 'weight') return `${+v} кг`;
      return String(+v);
    }

    async function loadProtocol(ev) {
      const box = $('event-body');
      const divs = ev.divisions || [];
      if (!divs.length) { box.innerHTML = '<div class="note">Категории не заданы.</div>'; return; }
      const fit = divsMatching(ev);
      // место считается внутри категории, поэтому лидерборд всегда про одну.
      // По умолчанию своя: атлет открывает его ради своей строки
      if (!fit.some(d => d.id === lbDiv)) {
        const my = ev.my_entry && fit.find(d => d.id === ev.my_entry.division_id);
        lbDiv = (my || fit[0] || divs[0]).id;
      }
      const cur = divs.find(d => d.id === lbDiv) || divs[0];
      // Категорию выбирает фильтр наверху, второго способа не заводим.
      // Ряд с именами появляется, только когда двух осей физически не хватает:
      // две категории с одинаковыми уровнем и полом — так бывает у возрастных
      // групп. Пока оси различают всё, третий ряд был бы просто дублем.
      const keys = fit.map(d => divLevel(d) + '/' + d.gender_rule);
      const byName = new Set(keys).size === fit.length ? '' : `
        <div class="filt" data-axis="div">
          ${fit.map(d => `<button data-v="${d.id}" class="${
            d.id === lbDiv ? 'on' : ''}">${esc(d.name)}</button>`).join('')}
        </div>`;
      box.innerHTML = filterBar(ev) + byName + findBar('Найти участника')
        + `<div class="pick"><div id="lb-pick-name">${esc(cur.name)}</div>
           <div class="prog" id="lb-prog">Считаем…</div></div><div id="lb-body"></div>`;
      wireFilter(ev);
      wireFind(ev);
      box.querySelectorAll('.filt[data-axis="div"] button').forEach(b =>
        b.onclick = () => { lbDiv = +b.dataset.v; renderEvent(ev); });
      renderProtocol(ev);
    }


    async function renderProtocol(ev) {
      const body = $('lb-body');
      body.innerHTML = skeleton(1);
      const d = await api(`/api/events/${ev.id}/leaderboard?division=${lbDiv}`);
      if (d.error === 'feed_unavailable') {
        // рядом с ошибкой не должно висеть «Считаем…»
        $('lb-prog').textContent = '';
        body.innerHTML = FEED_DOWN;
        return;
      }
      if (d.error) {
        $('lb-prog').textContent = '';
        body.innerHTML = '<div class="note">Лидерборд не загрузился.</div>';
        return;
      }
      $('lb-prog').textContent = d.wods_total
        ? `${d.wods_done} из ${d.wods_total} ${plural(d.wods_total,'комплекса','комплексов','комплексов')}`
        : '';
      if (!d.rows.length) {
        body.innerHTML = '<div class="note">В этой категории пока нет заявок.</div>';
        return;
      }
      // Поиск прячет чужие строки, но не пересчитывает места: место человека
      // в лидерборде не зависит от того, кого сейчас видно на экране.
      const rows = d.rows.filter(r => findHit(r.name)
        || (r.members || []).some(findHit));
      if (!rows.length) {
        body.innerHTML = '<div class="note">Никого не нашлось.</div>';
        return;
      }
      body.innerHTML = rows.map(r => {
        const isMine = !!r.is_me;
        const open = lbOpen.has(String(r.entry_id ?? r.name));
        const judged = r.wods.some(w => w.place);
        const detail = (judged ? `<div class="pw-head"><span>Комплекс</span>
            <span>Результат</span><span>Место</span><span>Баллы</span></div>` : '')
          + (r.wods.map(w => {
          const done = w.value !== null || (w.status && w.status !== 'ok');
          return `
          <div class="pw">
            <div class="pw-name">${esc(w.name)}</div>
            <div class="pw-val${done ? '' : ' off'}">${
              esc(fmtValue(w.value, w.result_type, w.status))}</div>
            <div class="pw-place${w.place && w.place <= 3 ? ' m' + w.place : ''}">${
              w.place ? w.place + ' место' : '—'}</div>
            <div class="pw-pts${w.points ? '' : ' zero'}">${w.place ? w.points : '—'}</div>
          </div>`;
        }).join('') || '<div class="pw pw-name">Комплексов ещё нет</div>');
        return `
        <div class="lb-item${open ? ' open' : ''}" data-id="${r.entry_id ?? r.name}">
          <button class="lb-row${isMine ? ' is-me' : ''}${
            r.place <= 3 ? ' m' + r.place : ''}">
            <div class="lb-place">${r.place}</div>
            <div class="lb-ava">${r.avatar
              ? `<img src="${esc(r.avatar)}" alt="" loading="lazy">` : esc(initials(r.name))}</div>
            <div>
              <div class="lb-name">${esc(r.name)}</div>
              ${r.members.length > 1 ? `<div class="lb-sub">${esc(r.members.join(', '))}</div>` : ''}
            </div>
            <div class="lb-pts">${r.points}</div>
            <div class="lb-chev">
              <svg width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1.5 6 6.5 11 1.5"/></svg>
            </div>
          </button>
          <div class="lb-detail">${detail}</div>
        </div>`;
      }).join('');
      body.querySelectorAll('.lb-item').forEach(item => {
        item.querySelector('.lb-row').onclick = () => {
          const id = item.dataset.id;
          item.classList.toggle('open');
          if (item.classList.contains('open')) lbOpen.add(id); else lbOpen.delete(id);
        };
      });
      pinOwnRow(d.rows.find(r => r.is_me));
    }

    // В протоколе на 70 человек свою строку не ищут пальцем: когда она
    // уходит из виду, прижимаем копию к низу экрана.
    let lbObserver = null;
    function pinOwnRow(row) {
      const pin = $('lb-pinned');
      lbObserver?.disconnect();
      if (!row) { pin.hidden = true; return; }
      pin.innerHTML = `
        <div class="lb-place" style="color:var(--accent)">${row.place}</div>
        <div class="lb-name">${esc(row.name)}</div>
        <div class="lb-pts">${row.points}</div>`;
      const el = $('lb-body').querySelector('.lb-row.is-me')?.closest('.lb-item');
      if (!el) { pin.hidden = true; return; }
      lbObserver = new IntersectionObserver(
        ([e]) => { pin.hidden = e.isIntersecting; },
        {rootMargin: `-${52}px 0px -${80}px 0px`});
      lbObserver.observe(el);
      pin.onclick = () => el.scrollIntoView({block:'center'});
    }

    // ── Комплексы ──
    async function loadWods(ev) {
      const box = $('event-body');
      box.innerHTML = skeleton(1);
      const list = await api(`/api/events/${ev.id}/wods`);
      if (list && list.error === 'feed_unavailable') { box.innerHTML = FEED_DOWN; return; }
      if (!Array.isArray(list)) { box.innerHTML = '<div class="note">Комплексы не загрузились.</div>'; return; }
      if (!list.length) { box.innerHTML = '<div class="note">Комплексы пока не объявлены.</div>'; return; }
      // комплекс без категорий идёт у всех — он остаётся при любом фильтре
      const ids = new Set(divsMatching(ev).map(d => d.id));
      const shown = list.filter(w => !w.divisions.length
        || w.divisions.some(d => ids.has(d.id)));
      if (!shown.length) {
        box.innerHTML = filterBar(ev)
          + '<div class="note">В этой категории комплексов нет.</div>';
        wireFilter(ev);
        return;
      }
      box.innerHTML = filterBar(ev) + shown.map(w => {
        const meta = [STAGE_LABEL[w.stage] || '', fmtDayLoose(w.day) || '']
          .filter(Boolean).join(' · ');
        // Тип результата показываем, только если организатор не описал формат
        // сам: «На время» рядом с «Время» — это одно и то же дважды.
        const terms = [
          ['Формат', w.scoring_note || RES_LABEL[w.result_type] || ''],
          ['Время', w.time_cap],
        ].filter(([, v]) => v).map(([k, v]) =>
          `<div class="acc-term"><b>${k}</b><i>${esc(v)}</i></div>`).join('');
        const who = w.divisions.length ? w.divisions.map(d => d.name).join(', ') : 'Все категории';
        return `
        <div class="acc" data-id="${w.id}">
          <button class="acc-head">
            <div>
              <div class="acc-name">${esc(w.name)}</div>
              ${meta ? `<div class="acc-meta">${esc(meta)}</div>` : ''}
              <div class="acc-terms">${terms}</div>
            </div>
            <div class="acc-chev">
              <svg width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1.5 6 6.5 11 1.5"/></svg>
            </div>
          </button>
          <div class="acc-body">
            ${w.description ? `<div class="acc-desc">${esc(w.description)}</div>`
                            : '<div class="acc-desc" style="color:var(--steel)">Описание не опубликовано.</div>'}
            <div class="acc-score"><span>${esc(who)}</span></div>
          </div>
        </div>`;
      }).join('');
      box.querySelectorAll('.acc').forEach(a =>
        a.querySelector('.acc-head').onclick = () => a.classList.toggle('open'));
      wireFilter(ev);
    }

    // ── Расписание ──
    async function loadSchedule(ev) {
      const box = $('event-body');
      box.innerHTML = skeleton(1);
      const list = await api(`/api/events/${ev.id}/schedule`);
      if (list && list.error === 'feed_unavailable') { box.innerHTML = FEED_DOWN; return; }
      if (!Array.isArray(list)) { box.innerHTML = '<div class="note">Расписание не загрузилось.</div>'; return; }
      if (!list.length) { box.innerHTML = '<div class="note">Расписание пока не опубликовано.</div>'; return; }
      // строка без категории — общая (регистрация, перерыв, награждение),
      // она нужна всем и фильтром не убирается
      // Фильтра здесь нет намеренно: расписание читают целиком — когда
      // регистрация, когда брифинг, когда награждение. Резать его по своей
      // категории значит прятать ровно то, за чем в него смотрят.
      const shown = list;
      const days = [...new Set(shown.map(s => s.day))];
      box.innerHTML = (shown.length ? days.map(day => `
        ${days.length > 1 ? `<div class="h day">${esc(fmtDayLoose(day))}</div>` : '<div style="height:8px"></div>'}
        ${shown.filter(s => s.day === day).map(s => `
          <div class="sch-row">
            <div class="sch-time">${esc(s.time)}</div>
            <div>
              <div class="sch-title">${esc(s.title)}</div>
              <div class="row-sub">${esc([s.location, s.division].filter(Boolean).join(', '))}</div>
            </div>
          </div>`).join('')}`).join('')
        : '<div class="note">Расписание пока не опубликовано.</div>');
    }

    // ── Заходы ──
    async function loadHeats(ev) {
      const box = $('event-body');
      box.innerHTML = skeleton(1);
      const list = await api(`/api/events/${ev.id}/heats`);
      if (list && list.error === 'feed_unavailable') { box.innerHTML = FEED_DOWN; return; }
      if (!Array.isArray(list)) { box.innerHTML = '<div class="note">Заходы не загрузились.</div>'; return; }
      if (!list.length) { box.innerHTML = '<div class="note">Заходы пока не опубликованы.</div>'; return; }
      evHeats = list;

      // «Ваши заходы» — шапка вкладки. В день старта сюда заходят ровно
      // за этим: где я и когда, по каждому комплексу. Список перестраивается
      // сам, как только организатор поменял расстановку.
      const mineAll = list.filter(h => h.entries.some(a => a.is_me));
      const mineBlock = !mineAll.length ? '' : `
        <div class="mine-heats">
          <div class="t">Ваши заходы</div>
          ${mineAll.map(h => {
            const me = h.entries.find(a => a.is_me);
            return `<div class="r">
              <div>
                <div class="w">${esc(h.wod || 'Заход')}</div>
                <div class="d">Заход ${h.number}${me && me.lane ? ` · дорожка ${me.lane}` : ''}${
                  h.day ? ' · ' + esc(fmtDayLoose(h.day)) : ''}</div>
              </div>
              <div class="tm">${esc(h.start_time || '—')}</div>
            </div>`;
          }).join('')}
        </div>`;

      const ids = new Set(divsMatching(ev).map(d => d.name));
      const fits = list.filter(h =>
        (!h.entries.length || h.entries.some(a => ids.has(a.division)))
        && (!evFind || h.entries.some(a => findHit(a.name)
             || (a.members || []).some(findHit))));
      if (!fits.length) {
        box.innerHTML = filterBar(ev) + findBar('Найти участника') + mineBlock
          + `<div class="note">${evFind
            ? 'Никого не нашлось.' : 'В этой категории заходов нет.'}</div>`;
        wireFilter(ev); wireFind(ev);
        return;
      }
      const days = [...new Set(fits.map(h => h.day))];
      box.innerHTML = filterBar(ev) + findBar('Найти участника') + mineBlock
        + days.map(day => `
        ${days.length > 1 ? `<div class="h day">${esc(fmtDayLoose(day))}</div>` : '<div style="height:8px"></div>'}
        ${fits.filter(h => h.day === day).map(h => {
          const mine = h.entries.some(a => a.is_me);
          // Номер захода считается внутри категории, поэтому «Заход 1» за день
          // встречается столько раз, сколько категорий. Без названия категории
          // в строке свой заход в списке на полсотни строк не находится.
          const cats = [...new Set(h.entries.map(a => a.division).filter(Boolean))];
          return `
          <button class="heat-row${mine ? ' is-me' : ''}" data-id="${h.id}">
            <div>
              <div class="heat-num">${esc(cats.join(' и ') || 'Заход')} · заход ${
                h.number}${mine ? ' · ваш' : ''}</div>
              <div class="row-sub">${esc([h.wod, h.location].filter(Boolean).join(', '))}</div>
            </div>
            <div class="heat-time">${esc(h.start_time)}</div>
          </button>`;
        }).join('')}`).join('');
      box.querySelectorAll('.heat-row').forEach(b => b.onclick = () => openHeat(ev, b.dataset.id));
      wireFilter(ev);
      wireFind(ev);
    }

    let evHeats = [];
    function openHeat(ev, id) {
      const h = evHeats.find(x => String(x.id) === String(id));
      if (!h) return;
      const box = $('event-body');
      $('ev-segs').hidden = true;
      box.innerHTML = `
        <div class="pick"><button id="heat-back">
          <svg viewBox="0 0 12 8" style="width:14px;height:10px;transform:rotate(90deg)"
               fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
               stroke-linejoin="round"><path d="M1 1.5 6 6.5 11 1.5"/></svg>
          Заход ${h.number}
        </button><div class="prog">${esc([h.wod, h.location].filter(Boolean).join(', '))}</div></div>

        ${h.briefing_start ? `
        <div class="phase">
          <div class="phase-label">Брифинг</div>
          <div class="phase-line">
            <div class="phase-time">${esc(h.briefing_start)}</div>
            <div class="phase-bar"></div>
            <div class="phase-time">${esc(h.briefing_end)}</div>
          </div>
        </div>` : ''}

        <div class="hs">
          <div class="hs-label">Заход начинается в</div>
          <div class="hs-time">${esc(h.start_time || '—')}</div>
        </div>

        <div class="h">Старт-лист<span>дорожка</span></div>
        ${h.entries.map(a => `
          <div class="lane-row${a.is_me ? ' is-me' : ''}">
            <div class="lane-num">${a.lane}</div>
            <div class="lb-ava">${a.avatar
              ? `<img src="${esc(a.avatar)}" alt="" loading="lazy">` : esc(initials(a.name))}</div>
            <div>
              <div class="lb-name">${esc(a.name)}</div>
              <div class="lb-sub">${esc(a.division)}</div>
            </div>
          </div>`).join('') || '<div class="note">Состав не задан.</div>'}
        <div style="height:32px"></div>`;
      $('heat-back').onclick = () => { renderEvent(ev); };
      window.scrollTo(0, 0);
    }

    // Блок действия на экране события: одно состояние — один блок.
    function actionBlock(ev) {
      if (ev.my_entry) {
        const e = ev.my_entry;
        const paid = e.payment_status === 'paid';
        const left = daysLeft(e.pay_due);
        // Платформа денег не берёт, и её работа — не спрятать этот шаг,
        // а назвать его: сколько, куда и до какого числа. Срок виден с первой
        // секунды: место держится до него, дальше заявка снимается сама.
        const due = paid || left === null ? ''
          : left < 0 ? 'Срок оплаты истёк'
          : left === 0 ? 'Оплатить нужно сегодня'
          : `Оплатить до ${fmtDay(e.pay_due)} — ${left} ${
              plural(left, 'день', 'дня', 'дней')}`;
        return `
        <div class="entry">
          <div class="entry-top"><i class="dot ${paid ? 'you' : 'warn'}"></i>${
            paid ? 'Участие оплачено' : 'Заявка принята'}</div>
          <div class="entry-div">${esc(e.division)}</div>
          ${paid ? '' : `
            <div class="pay">
              <div class="pay-sum">${esc(money(e.price))}<span>оплата у организатора</span></div>
              ${due ? `<div class="pay-due${left !== null && left <= 1 ? ' hot' : ''}">${
                esc(due)}</div>` : ''}
              ${ev.pay_info ? `<div class="pay-how">${esc(ev.pay_info)}</div>` : ''}
              ${ev.pay_url ? '<button class="btn" id="ev-pay">Перейти к оплате</button>' : ''}
            </div>`}
          ${ev.status === 'registration'
            ? '<div class="entry-act"><button id="ev-withdraw">Снять заявку</button></div>'
            : ''}
        </div>`;
      }
      if (ev.status !== 'registration') return '';
      if (isAnnounced(ev)) return `
        <div class="notice">
          <b>Регистрация ещё не открыта</b>
          Приём заявок начнётся ${esc(fmtDay(ev.reg_opens_at))}.
        </div>`;
      if (!ev.profile_complete) return `
        <div class="notice">
          <b>Профиль не заполнен</b>
          Имя и пол нужны организатору, чтобы включить вас в протокол.
          <button class="btn" id="ev-to-profile">Заполнить профиль</button>
        </div>`;
      return `<div class="pad"><button class="btn" id="ev-register">Подать заявку</button></div>`;
    }

    function wireActions(ev) {
      const reg = $('ev-register'), wd = $('ev-withdraw'), pr = $('ev-to-profile');
      const pay = $('ev-pay');
      // ссылка организатора уводит из мини-аппа наружу — открываем как внешнюю
      if (pay) pay.onclick = () => openOut(evCur.pay_url);
      if (reg) reg.onclick = () => pickDivision(ev, reg);
      if (wd)  wd.onclick  = () => confirmWithdraw(ev, wd);
      if (pr)  pr.onclick  = () => show('profile');
    }

    // Почему в категорию нельзя — говорим до нажатия, а не после
    function blockedReason(ev, d) {
      if (d.team_size > 1) return 'Командный';
      if (d.gender_rule === 'male'   && me?.user?.gender !== 'М') return 'Только мужчины';
      if (d.gender_rule === 'female' && me?.user?.gender !== 'Ж') return 'Только женщины';
      if (d.max_entries && d.entries >= d.max_entries) return 'Мест нет';
      return '';
    }

    function pickDivision(ev, trigger) {
      let chosen = null;
      const rows = (ev.divisions || []).map(d => {
        const why = blockedReason(ev, d);
        const sub = (d.team_size > 1 ? `Команда, ${d.team_size} чел.` : 'Личный зачёт')
          + `, ${money(d.price)}${d.team_size > 1 && d.price ? ' за команду' : ''}`;
        return `
        <button class="opt" role="radio" aria-checked="false" data-id="${d.id}"
                data-price="${d.price}" ${why ? 'disabled' : ''}>
          <div>
            <div class="opt-name">${paintLevel(d.name, d.level)}</div>
            <div class="opt-sub">${esc(sub)}</div>
          </div>
          ${why ? `<div class="opt-why">${esc(why)}</div>` : '<i class="tick"></i>'}
        </button>`;
      }).join('');

      openSheet(`
        <h3>Выбор категории</h3>
        <p>${esc(ev.title)}</p>
        <div role="radiogroup" aria-label="Категория">${rows}</div>
        <div class="sheet-foot">
          <button class="btn" id="sh-go" disabled>Выберите категорию</button>
          <div class="sheet-note">Оплата у организатора — реквизиты и срок
            появятся сразу после подачи.</div>
          <button class="btn text" id="sh-cancel">Отмена</button>
        </div>`, trigger);

      const go = $('sh-go');
      $('sh-cancel').onclick = closeSheet;
      $('sheet').querySelectorAll('.opt:not([disabled])').forEach(b => b.onclick = () => {
        $('sheet').querySelectorAll('.opt').forEach(x => x.setAttribute('aria-checked', 'false'));
        b.setAttribute('aria-checked', 'true');
        chosen = b.dataset.id;
        // Цену не выносим на кнопку: платформа денег не принимает, и
        // «Подать заявку · 3 500 ₽» читалось бы как оплата. Сумма стоит
        // в строке категории, а куда платить — скажем после подачи.
        go.textContent = 'Подать заявку';
        go.disabled = false;
      });

      go.onclick = async () => {
        if (!chosen) return;
        go.disabled = true; go.textContent = 'Отправляем…';
        const res = await send(`/api/events/${ev.id}/entry`, 'POST', {division_id: Number(chosen)});
        if (res.error) {
          go.disabled = false; go.textContent = 'Подать заявку';
          $('sheet').querySelector('p').innerHTML = `<span class="err">${esc(reason(res.error))}</span>`;
          return;
        }
        closeSheet();
        toast('Заявка подана');
        await refreshMe();
        reloadEvent(ev.id);
      };
    }

    function confirmWithdraw(ev, trigger) {
      openSheet(`
        <h3>Снять заявку?</h3>
        <p>${esc(ev.title)}, ${esc(ev.my_entry.division)}. Место освободится для других,
           подать заявку снова можно, пока идёт регистрация.</p>
        <div class="sheet-foot">
          <button class="btn text" id="sh-yes">Снять заявку</button>
          <button class="btn" id="sh-no">Оставить</button>
        </div>`, trigger);
      $('sh-no').onclick = closeSheet;
      $('sh-yes').onclick = async () => {
        const b = $('sh-yes');
        b.disabled = true; b.textContent = 'Снимаем…';
        const res = await send(`/api/events/${ev.id}/entry`, 'DELETE');
        if (res.error) {
          b.disabled = false; b.textContent = 'Снять заявку';
          $('sheet').querySelector('p').innerHTML = `<span class="err">${esc(reason(res.error))}</span>`;
          return;
        }
        closeSheet();
        toast('Заявка снята');
        await refreshMe();
        reloadEvent(ev.id);
      };
    }

    // Перерисовка события на месте: после заявки экран не должен прыгать наверх
    async function reloadEvent(id) {
      const y = window.scrollY;
      const ev = await api('/api/events/' + id);
      if (ev.error) return;
      renderEvent(ev);
      window.scrollTo(0, y);
      // отметка «вы заявлены» живёт ещё и в ленте, и на главной
      allEvents = null;
    }

    // ── Мои соревнования ──
    const STAFF_ROLE = {organizer: 'Организатор', judge: 'Судья'};

    async function loadMy() {
      const box = $('my-list');
      box.innerHTML = skeleton(1);
      if (!me) await refreshMe();
      if (me.error) {
        box.innerHTML = '<div class="note">Откройте приложение через Telegram, чтобы увидеть свои заявки.</div>';
        return;
      }
      const list = me.my_events || [];
      // Работа на старте — отдельный список: судья приходит сюда не за своей
      // заявкой, а за своим стартом, и путать одно с другим нельзя.
      const staff = me.staff_of || [];
      if (!list.length && !staff.length && !me.is_organizer) {
        box.innerHTML = '<div class="note">Вы пока никуда не заявлены.<br>Выберите старт на главной или в поиске.</div>';
        return;
      }
      const entryRows = list.map(e => {
        const [tone, text] = stateLine(e);
        return `
        <button class="my-row" data-id="${e.id}">
          <div class="mark sm">${markHTML(e)}</div>
          <div>
            <div class="my-title">${esc(e.title)}</div>
            <div class="row-sub">${esc(fmtDates(e.date_start, e.date_end))}, ${esc(e.division)}</div>
            <div class="state" style="margin-top:5px"><i class="dot ${tone}"></i>${esc(text)}</div>
          </div>
        </button>`;
      }).join('');
      const staffRows = staff.map(e => `
        <button class="my-row" data-id="${e.id}">
          <div class="mark sm">${markHTML(e)}</div>
          <div>
            <div class="my-title">${esc(e.title)}</div>
            <div class="row-sub">${esc(STAFF_ROLE[e.role] || e.role)}${
              e.date_start ? ', ' + esc(fmtDates(e.date_start, e.date_end)) : ''}</div>
          </div>
        </button>`).join('');

      // Организатору нужен десктоп: карточка, категории, комплексы и заходы
      // на телефоне не заводятся. Ссылка короткая, дальше сессия на 12 часов.
      // не по списку выше: он показывает только предстоящее, а войти
      // нужно и после старта — поправить результат или доотметить оплату
      const isOrg = !!me.is_organizer;
      const admin = !isOrg ? '' : `
        <div class="pad" style="padding-top:14px">
          <button class="btn quiet" id="go-admin">Открыть админку</button>
          <div class="note" style="padding:10px 0 0">Откроется в браузере.
            Там заводятся категории, комплексы, заходы и расписание.</div>
        </div>`;
      box.innerHTML = (staff.length || isOrg)
        ? `${staffRows ? '<div class="h">Работа на стартах</div>' + staffRows : ''}${admin}
           <div class="h">Мои заявки</div>${entryRows
             || '<div class="note">Вы пока никуда не заявлены.</div>'}`
        : entryRows;
      box.querySelectorAll('[data-id]').forEach(c => c.onclick = () => openEvent(c.dataset.id));
      const ga = $('go-admin');
      if (ga) ga.onclick = async () => {
        ga.disabled = true;
        const r = await send('/api/admin/link', 'POST', {});
        ga.disabled = false;
        if (r.error || !r.url) { toast('Не получилось открыть админку'); return; }
        openOut(r.url);
      };
    }

    // ── Медиа-партнёр ──
    let partner = null;
    async function ensurePartner() {
      if (partner === null) partner = await api('/api/partner') || false;
      return partner && !partner.error ? partner : null;
    }

    const ptLogo = p => p.has_logo
      ? `<img src="/api/partner-logo/${p.id}?v=${p.logo_v}" alt="">`
      : esc(p.name.slice(0, 2));

    // Внешняя ссылка: t.me открываем внутри Telegram, остальное — системно.
    function openOut(url) {
      if (!url) return;
      if (tg?.openTelegramLink && /^https?:\/\/t\.me\//.test(url)) tg.openTelegramLink(url);
      else if (tg?.openLink) tg.openLink(url);
      else window.open(url, '_blank', 'noopener');
    }

    // Ссылка на канал открывается внутри Telegram, а не в браузере: человек
    // не выпадает из приложения, и переход стоит ему один тап.
    function openPartner(p, place, url) {
      send('/api/partner/click', 'POST', {id: p.id, place});
      url = url || p.url;
      if (tg?.openTelegramLink && /^https?:\/\/t\.me\//.test(url)) tg.openTelegramLink(url);
      else if (tg?.openLink) tg.openLink(url);
      else window.open(url, '_blank', 'noopener');
    }

    const CHEVRON = `<svg viewBox="0 0 7 11" fill="none" stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l5 4.5L1 10"/></svg>`;

    function partnerLine(p) {
      return `<button class="pt-line" data-pt="header">
        <i class="pt-logo">${ptLogo(p)}</i>
        <span>По материалам ${esc(p.name)}</span>${CHEVRON}</button>`;
    }
    function partnerTag(p) {
      return `<span class="pt-tag" data-pt="preview" role="button" tabindex="0">
        <i>${ptLogo(p)}</i>Новости из ${esc(p.name)}</span>`;
    }
    function partnerCard(p, place, title, sub) {
      return `<button class="pt-card" data-pt="${place}">
        <i class="pt-logo">${ptLogo(p)}</i>
        <div style="flex:1">
          <div class="pt-name">${esc(title)}</div>
          <div class="pt-sub">${esc(sub)}</div>
        </div>
        <div class="pt-go">Открыть</div></button>`;
    }
    function wirePartner(root, p, url) {
      root.querySelectorAll('[data-pt]').forEach(b =>
        b.onclick = e => { e.stopPropagation(); openPartner(p, b.dataset.pt, url); });
    }

    // ── Новости ──
    const NEWS_SEGS = [
      ['all',   'Все',       () => true],
      ['ru',    'CF Россия', n => n.category === 'ru'],
      ['world', 'CF Мир',    n => n.category === 'world'],
    ];
    let newsSeg = 'all', newsList = null;

    async function loadNews() {
      const box = $('news-list');
      if (!newsList) box.innerHTML = skeleton(1);
      await ensurePartner();
      const list = await api('/api/news');
      if (!Array.isArray(list)) {
        $('news-segs').innerHTML = '';
        box.innerHTML = '<div class="note">Новости не загрузились.<br>Проверьте связь и откройте вкладку заново.</div>';
        return;
      }
      newsList = list;
      renderNewsSegs();
      renderNewsList();
    }

    function renderNewsSegs() {
      $('news-segs').innerHTML = NEWS_SEGS.map(([key, label, test]) => {
        const n = newsList.filter(test).length;
        return `<button class="seg" role="tab" data-seg="${key}" aria-selected="${key === newsSeg}">
          ${label}${n ? `<b class="num">${n}</b>` : ''}</button>`;
      }).join('');
      $('news-segs').querySelectorAll('.seg').forEach(b => b.onclick = () => {
        newsSeg = b.dataset.seg; renderNewsSegs(); renderNewsList();
      });
    }

    function renderNewsList() {
      const box = $('news-list');
      const test = NEWS_SEGS.find(s => s[0] === newsSeg)[2];
      const list = newsList.filter(test);
      if (!list.length) {
        box.innerHTML = `<div class="note">${newsSeg === 'all'
          ? 'Новостей пока нет.'
          : 'В этом разделе новостей пока нет.'}</div>`;
        return;
      }
      const p = partner && !partner.error ? partner : null;
      box.innerHTML = (p ? partnerLine(p) : '') + list.map(n => `
        <button class="news-row" data-id="${n.id}">
          <div class="news-thumb">${n.has_image
            ? `<img src="/api/news-image/${n.id}?v=${n.image_v}" alt="" loading="lazy">`
            : `<div class="stub" aria-hidden="true">${esc(n.title.slice(0,1))}</div>`}</div>
          <div>
            <div class="news-title">${esc(n.title)}</div>
            ${n.summary ? `<div class="news-sum">${esc(n.summary)}</div>` : ''}
            <div class="news-date">${esc(fmtNewsDate(n.published_at))}</div>
            ${p && n.partner_id === p.id ? partnerTag(p) : ''}
          </div>
        </button>`).join('')
        + (p ? partnerCard(p, 'feed', p.name,
             `${p.audience ? p.audience + ' читателей · ' : ''}${p.tagline}`) : '');
      box.querySelectorAll('.news-row').forEach(c => c.onclick = () => openArticle(c.dataset.id));
      if (p) {
        // метка ведёт на исходный пост, блок в конце ленты — на канал
        box.querySelectorAll('.news-row').forEach(row => {
          const tag = row.querySelector('.pt-tag');
          if (!tag) return;
          const n = list.find(x => String(x.id) === row.dataset.id);
          tag.onclick = e => { e.stopPropagation(); openPartner(p, 'preview', n?.source_url); };
        });
        const card = box.querySelector('.pt-card');
        if (card) card.onclick = () => openPartner(p, 'feed');
        const line = box.querySelector('.pt-line');
        if (line) line.onclick = () => openPartner(p, 'header');
      }
    }

    async function openArticle(id) {
      show('article');
      const box = $('article-body');
      box.innerHTML = skeleton(1);
      await ensurePartner();
      const n = await api('/api/news/' + id);
      if (n.error) {
        box.innerHTML = '<div class="note">Новость не открылась.</div>';
        return;
      }
      renderBar('article', n.title);
      // у поста из канала summary — это начало body, лид его бы просто повторил
      const lead = n.summary && !(n.body || '').includes(n.summary.slice(0, 60))
        ? n.summary : '';
      box.innerHTML = `
        <div class="article">
          ${n.has_image ? `<div class="art"><img src="/api/news-image/${n.id}?v=${n.image_v}" alt=""></div>` : ''}
          <h1>${esc(n.title)}</h1>
          <div class="news-date">${esc(fmtNewsDate(n.published_at))}</div>
          ${lead ? `<p class="lead">${esc(lead)}</p>` : ''}
          ${n.body ? `<p>${esc(n.body)}</p>` : ''}
          ${(partner && !partner.error && n.partner_id === partner.id)
            ? partnerCard(partner, 'article', `Читать в ${partner.name}`,
                          'Оригинал поста в канале')
            : (partner && !partner.error)
              ? partnerCard(partner, 'article', `Читать в ${partner.name}`, partner.tagline)
              : (n.source_url ? `<div class="pad links" style="padding-top:24px">
                  <a href="${esc(n.source_url)}" target="_blank" rel="noopener">Источник</a></div>` : '')}
          <div style="height:32px"></div>
        </div>`;
      if (partner && !partner.error)
        wirePartner(box, partner, n.partner_id === partner.id ? n.source_url : null);
    }

    // ── Профиль ──
    // ── Профиль ──
    const CAMERA = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/>
      <circle cx="12" cy="13" r="3.5"/></svg>`;
    const GENDER_WORD = {'М': 'Мужской', 'Ж': 'Женский'};
    const noTelegram = '<div class="note">Откройте приложение через Telegram, чтобы заполнить профиль.</div>';
    const tile = (value, label, unit = '', word = false) => `
      <div class="tile${word ? ' word' : ''}"><b>${value == null || value === '' ? '—'
        : `${esc(value)}${unit ? `<small>${unit}</small>` : ''}`}</b><span>${label}</span></div>`;
    // вкладку лидерборда ищем по названию: ключ живёт в EV_TABS, и дублировать его здесь незачем
    const lbTab = () => (EV_TABS.find(t => t[1] === 'Лидерборд') || ['overview'])[0];

    function nextStartHTML(e) {
      const d = daysLeft(e.date_start);
      const when = e.status === 'live' ? '<i class="dot live"></i>Идёт сейчас'
        : d === null ? '' : d <= 0 ? 'Сегодня' : `Через ${d} ${plural(d,'день','дня','дней')}`;
      // бесплатная категория — про оплату молчим, иначе «не оплачено» пугает зря
      const pay = !e.price ? ''
        : e.payment_status === 'paid' ? '<i class="dot you"></i><b>Оплачено</b>'
        : e.pay_due ? `<i class="dot warn"></i>Оплатить до&nbsp;<b>${esc(fmtDay(e.pay_due))}</b>`
        : '<i class="dot warn"></i>Ждёт оплаты';
      return `
        <div class="h">Ближайший старт</div>
        <button class="next" data-ev="${e.id}">
          <div class="next-main">
            <div class="mark sm">${markHTML(e)}</div>
            <div style="min-width:0">
              <div class="next-title">${esc(e.title)}</div>
              <div class="row-sub">${esc([fmtDates(e.date_start, e.date_end), e.division].filter(Boolean).join(' · '))}</div>
            </div>
          </div>
          ${when || pay ? `<div class="next-foot"><span class="next-when">${when}</span><span>${pay}</span></div>` : ''}
        </button>`;
    }

    function histRowHTML(x) {
      const medal = x.place <= 3 ? ` m${x.place}` : '';
      const sub = [fmtDates(x.date_start, x.date_end), x.division, `${x.place} из ${x.of}`];
      return `
        <button class="hist" data-ev="${x.id}" data-tab="${lbTab()}">
          <div class="hist-place${medal}">${x.place}</div>
          <div class="hist-main">
            <div class="hist-title">${esc(x.title)}</div>
            <div class="row-sub">${esc(sub.filter(Boolean).join(' · '))}${x.status === 'live' ? ' · идёт' : ''}</div>
          </div>
          <div class="hist-pts"><b class="num">${x.points}</b><span>${plural(x.points,'балл','балла','баллов')}</span></div>
        </button>`;
    }

    async function loadProfile() {
      const box = $('profile-body');
      box.innerHTML = skeleton(1);
      if (!me) await refreshMe();
      if (me.error) { box.innerHTML = noTelegram; return; }
      const u = me.user;
      const got = await api('/api/me/history');
      const hist = Array.isArray(got?.history) ? got.history : [];
      const stats = got?.stats || {starts: 0, podiums: 0, best: null};
      const next = (me.my_events || [])
        .filter(e => e.status !== 'finished')
        .sort((a, b) => String(a.date_start).localeCompare(String(b.date_start)))[0];
      box.innerHTML = `
        <div class="ath">
          <button class="ath-ava" id="p-photo" aria-label="Сменить фото">
            <span class="ath-pic">${u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : esc(initials(u.name))}</span>
            <span class="ath-cam" aria-hidden="true">${CAMERA}</span>
          </button>
          <div class="ath-name">${esc(u.name || 'Без имени')}</div>
          <div class="ath-sub">${esc([u.club || 'Независимый атлет', u.city].filter(Boolean).join(' · '))}</div>
          <button class="btn quiet ath-edit" id="p-edit">Изменить профиль</button>
        </div>
        ${!me.profile_complete ? `
          <div class="notice" style="margin-top:24px">
            <b>Профиль не заполнен</b>
            Имя и пол нужны, чтобы подать заявку на старт.
            <button class="btn" id="p-fill">Заполнить профиль</button>
          </div>` : ''}
        <div class="tiles">
          ${tile(u.height_cm, 'Рост', 'см')}
          ${tile(u.weight_kg, 'Вес', 'кг')}
          ${tile(GENDER_WORD[u.gender], 'Пол', '', true)}
        </div>
        ${next ? nextStartHTML(next) : ''}
        <div class="h">Статистика</div>
        <div class="tiles stats">
          ${tile(stats.starts, plural(stats.starts, 'старт', 'старта', 'стартов'))}
          ${tile(stats.podiums, plural(stats.podiums, 'подиум', 'подиума', 'подиумов'))}
          ${tile(stats.best, 'лучшее место')}
        </div>
        <div class="h">История выступлений${hist.length ? `<span>${hist.length}</span>` : ''}</div>
        ${hist.length ? hist.map(histRowHTML).join('')
          : '<div class="note tight">Здесь появятся старты, в которых вы выступили: место, баллы и переход в лидерборд.</div>'}
        <div class="h">Настройки</div>
        <label class="switch-row" for="p-notify">
          <span><b>Уведомления в боте</b>
            <small>${me.is_organizer
              ? 'Подтверждение ваших заявок и новые заявки на ваших стартах'
              : 'Подтверждение заявки со сроком оплаты'}</small></span>
          <input type="checkbox" id="p-notify" role="switch"${u.notify === false ? '' : ' checked'}>
          <i class="switch" aria-hidden="true"></i>
        </label>
        <div style="height:32px"></div>`;
      $('p-photo').onclick = () => $('photo-input').click();
      $('p-edit').onclick = () => show('profile-edit');
      const fill = $('p-fill');
      if (fill) fill.onclick = () => show('profile-edit');
      box.querySelectorAll('[data-ev]').forEach(b =>
        b.onclick = () => openEvent(b.dataset.ev, b.dataset.tab || 'overview'));
      $('p-notify').onchange = saveNotify;
    }

    // Выключатель сохраняется сразу — отдельной кнопки у карточки нет. Остальные
    // поля отправляем как есть: сервер перезаписывает профиль целиком.
    async function saveNotify(e) {
      const u = me.user, on = e.target.checked;
      const res = await send('/api/me', 'PATCH', {
        name: u.name || '', gender: u.gender || '', city: u.city || '', gym: u.gym || '',
        height_cm: u.height_cm ?? '', weight_kg: u.weight_kg ?? '', club_id: u.club_id ?? '',
        notify: on,
      });
      if (res.error) { e.target.checked = !on; toast('Не сохранилось'); return; }
      me.user = res.user;
      toast(on ? 'Уведомления включены' : 'Уведомления выключены');
    }

    async function loadProfileEdit() {
      const box = $('profile-edit-body');
      box.innerHTML = skeleton(1);
      if (!me) await refreshMe();
      if (me.error) { box.innerHTML = noTelegram; return; }
      if (!clubs) {
        const list = await api('/api/clubs');
        clubs = Array.isArray(list) ? list : [];
      }
      const u = me.user;
      box.innerHTML = `
        <div class="ed-title">Профиль</div>
        <div class="field"><label for="p-name">Имя и фамилия</label>
          <input id="p-name" value="${esc(u.name)}" placeholder="Иван Петров" /></div>
        <div class="field"><label for="p-gender">Пол</label>
          <select id="p-gender">
            <option value="">Не указан</option>
            <option value="М"${u.gender==='М'?' selected':''}>Мужской</option>
            <option value="Ж"${u.gender==='Ж'?' selected':''}>Женский</option>
          </select></div>
        <div class="pair-wrap"><div class="pair">
          <div class="field"><label for="p-height">Рост, см</label>
            <input id="p-height" type="text" inputmode="numeric" value="${u.height_cm ?? ''}" placeholder="178" /></div>
          <div class="field"><label for="p-weight">Вес, кг</label>
            <input id="p-weight" type="text" inputmode="decimal" value="${u.weight_kg ?? ''}" placeholder="82" /></div>
        </div></div>
        <div class="field"><label for="p-club">Клуб</label>
          <select id="p-club">
            <option value="">Независимый атлет</option>
            ${clubs.map(c => `<option value="${c.id}"${u.club_id === c.id ? ' selected' : ''}>${
              esc(c.name)}${c.city ? ` — ${esc(c.city)}` : ''}</option>`).join('')}
          </select></div>
        <div class="field"><label for="p-city">Город</label>
          <input id="p-city" value="${esc(u.city)}" placeholder="Севастополь" /></div>
        <div id="p-err"></div>
        <div class="save-bar"><button class="btn" id="p-save">Сохранить</button></div>`;
      $('p-save').onclick = saveProfile;
    }

    // Уменьшаем на клиенте: с телефона прилетает 4–12 МБ, а нужно 512px
    $('photo-input').addEventListener('change', async e => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type) && !file.type.startsWith('image/')) {
        toast('Подойдёт JPEG или PNG'); return;
      }
      toast('Загружаем фото…');
      try {
        const bmp = await createImageBitmap(file);
        const side = Math.min(bmp.width, bmp.height), S = 512;
        const cv = Object.assign(document.createElement('canvas'), {width:S, height:S});
        cv.getContext('2d').drawImage(
          bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, S, S);
        const res = await send('/api/me/photo', 'POST', {data: cv.toDataURL('image/jpeg', .85)});
        if (res.error) { toast(reason(res.error)); return; }
        me.user.avatar = res.avatar;
        loadProfile();
        toast('Фото обновлено');
      } catch (err) {
        toast('Не удалось прочитать файл');
      }
    });

    async function saveProfile() {
      const btn = $('p-save');
      const fields = {name:$('p-name'), gender:$('p-gender'), height_cm:$('p-height'),
                      weight_kg:$('p-weight'), club_id:$('p-club'), city:$('p-city')};
      Object.values(fields).forEach(f => f.classList.remove('bad'));
      // сообщения прошлой попытки убираем целиком, иначе они переживают успешное
      // сохранение и человек видит ошибку там, где всё уже в порядке
      $('screen-profile-edit').querySelectorAll('.err').forEach(e => e.remove());
      $('p-err').innerHTML = '';

      btn.disabled = true; btn.textContent = 'Сохраняем…';
      const res = await send('/api/me', 'PATCH', {
        name: fields.name.value, gender: fields.gender.value, city: fields.city.value,
        gym: me.user.gym || '',
        height_cm: fields.height_cm.value, weight_kg: fields.weight_kg.value,
        club_id: fields.club_id.value,
      });
      btn.disabled = false; btn.textContent = 'Сохранить';

      if (res.error) {
        // ошибку показываем у поля, к которому она относится
        const bad = res.fields || {};
        Object.entries(bad).forEach(([k, msg]) => {
          const f = fields[k];
          if (!f) return;
          f.classList.add('bad');
          f.insertAdjacentHTML('afterend', `<div class="err">${esc(msg)}</div>`);
        });
        if (!Object.keys(bad).length)
          $('p-err').innerHTML = `<div class="pad err">${esc(reason(res.error))}</div>`;
        return;
      }
      me.user = res.user;
      me.profile_complete = res.profile_complete;
      toast('Профиль сохранён');
      show('profile');
    }

    // ── Старт ──
    // Нужный экран можно открыть сразу: ?screen=home|search|my|news|profile,
    // ?event=<id> или ?news=<id>. Удобно для отладки и для съёмки макетов.
    (async () => {
      await refreshMe();
      const q = new URLSearchParams(location.search);
      // Ссылка вида t.me/бот?startapp=event_12 открывает мини-апп сразу на
      // событии — если у бота в BotFather включён основной мини-апп. Кнопке
      // в уведомлениях это не нужно: она открывает приложение через ?event=.
      const sp = tg?.initDataUnsafe?.start_param || '';
      const deep = sp.match(/^event_(\d+)$/);
      const eventId = (deep && deep[1]) || q.get('event');
      const newsId = q.get('news'), screen = q.get('screen');
      if (eventId)      { renderBar('event',''); openEvent(eventId); }
      else if (newsId)  { renderBar('article',''); openArticle(newsId); }
      else show(SCREENS.includes(screen) ? screen : 'home');
    })();
  </script>
</body>
</html>
